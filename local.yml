---
# Play order: pre_tasks (package cache) → base (all hosts) → server → workstation → cleanup.
# Run a subset with tags:  ansible-playbook local.yml --tags base
#                          ansible-playbook local.yml --tags server,pihole
#                          ansible-playbook local.yml --tags dotfiles --skip-tags always
# Limit to one host:       ansible-playbook local.yml --limit serverannah
- name: Refresh package metadata on every host
  hosts: all
  tags: always
  become: true
  pre_tasks:
    - name: Update repositories (Arch)
      tags: always
      become: true
      community.general.pacman:
        update_cache: true
      changed_when: false
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Update repositories and apply distribution upgrades
      tags: always
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      # No changed_when override here: a dist upgrade is a real system change, so
      # let Ansible report "changed" honestly when packages were actually upgraded.
      # os_family covers every Debian-derivative (Debian, Ubuntu, Pop!_OS, Linux
      # Mint, …) so apt tasks no longer silently skip on a distro we forgot to list.
      when: ansible_facts['os_family'] == "Debian"

# run roles
- name: Apply the common base role
  hosts: all
  tags: base
  become: true
  roles:
    - base

- name: Apply the server role
  hosts: server
  tags: server
  become: true
  roles:
    # The server role now contains only server-specific storage and services.
    - server

- name: Apply the workstation role
  hosts: workstation
  tags: workstation
  become: true
  roles:
    - workstation

# Gated on its own flag rather than a group: a role that deploys a trading
# process must never arrive on a host because someone edited the inventory.
- name: Apply the trading agent role
  hosts: all
  tags: trading_agent
  become: true
  roles:
    - role: trading_agent
      when: trading_agent_enabled | default(false)

- name: Apply the kids role
  hosts: kids
  tags: kids
  become: true
  roles:
    - kids

# end of run cleanup
- name: Clean up the package cache after the run
  hosts: all
  become: true
  tasks:
    - name: Clean up the package cache (Debian and Ubuntu)
      tags: always
      ansible.builtin.apt:
        autoclean: true
      changed_when: false
      # os_family covers every Debian-derivative (Debian, Ubuntu, Pop!_OS, Linux
      # Mint, …) so apt tasks no longer silently skip on a distro we forgot to list.
      when: ansible_facts['os_family'] == "Debian"

    - name: Autoremove orphan packages (Debian and Ubuntu)
      tags: always
      ansible.builtin.apt:
        autoremove: true
        purge: true
      # os_family covers every Debian-derivative (Debian, Ubuntu, Pop!_OS, Linux
      # Mint, …) so apt tasks no longer silently skip on a distro we forgot to list.
      when: ansible_facts['os_family'] == "Debian"
