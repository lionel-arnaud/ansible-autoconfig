---
# Every service actually running on serverannah. Grouped the way they are used,
# not the way they are deployed.
#
# siteMonitor normally points at the INTERNAL container URL: admin tools sit
# behind the login portal and their public homepage would only test that portal.
# Umami's public tracker is the exception: it also checks DNS, TLS and routing.
#
# `server: local-docker` + `container:` reads container state through the
# filtered read-only Docker socket proxy (see roles/server/tasks/docker_socket_proxy.yml),
# never the raw socket.

- Public Sites:
    - AuMenuIlYA:
        icon: wordpress.png
        href: https://www.aumenuilya.fr/
        description: Mimi's food blog
        server: local-docker
        container: aumenuilya
        showStats: true
        siteMonitor: http://aumenuilya/
    - Dinnizer:
        icon: mdi-silverware-fork-knife
        href: https://app.dinnizer.com/
        description: Meal-planning app
        server: local-docker
        container: dinnizer
        showStats: true
        siteMonitor: http://dinnizer:3000/
    - Dinnizer Website:
        icon: mdi-web
        href: https://www.dinnizer.com/
        description: Public landing site
        server: local-docker
        container: dinnizer-website
        showStats: true
        siteMonitor: http://dinnizer-website/
    - Tabletop Timer:
