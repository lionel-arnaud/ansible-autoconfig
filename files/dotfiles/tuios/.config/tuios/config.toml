# Keep workspace cycling consistent with Omarchy, without depending on the
# shifted number row of an AZERTY keyboard. Global bindings work in both TUIOS
# window-management and terminal modes.
[keybindings.global]
next_workspace = ["alt+tab"]
prev_workspace = ["alt+shift+tab"]
# Leave Ctrl+P to programs in panes (notably OpenCode). TUIOS's command
# palette remains available through the leader: Ctrl+B, then P.
command_palette = []

[keybindings.window_management]
copy_mode_search_forward = ["/"]

[startup]
tiled = true
daemon = true
