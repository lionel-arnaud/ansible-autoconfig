---
# NOTE: Opt-in per host, same pattern as base_dotfiles_enabled.
# Set workstation_enabled: true in host_vars/<hostname> to activate this role.
workstation_enabled: false
workstation_user: "{{ desktop_user | default('lion') }}"
workstation_home: "/home/{{ workstation_user }}"

# Sub-features are on by default once workstation_enabled is true, except
# espanso which requires an explicit opt-in (AUR build on Arch, see below).
workstation_cli_enabled: true
workstation_dotfiles_enabled: true
workstation_espanso_enabled: false
workstation_firewall_enabled: true
workstation_keyd_enabled: false

# ufw rules for a LAN workstation. Prefer an application profile shipped by the
# package over a hard-coded port range; KDEConnect resolves to 1714:1764 on both
# tcp and udp (see /etc/ufw/applications.d/kdeconnect), which KDE Connect needs
# for UDP discovery broadcasts and the TCP connect-back from the phone.
# ufw application profiles to allow. A profile only exists once the package that
# ships it is installed, and ufw errors rather than skipping when asked for one
# it does not know — so a headless host with no desktop must override this to []
# rather than inherit a desktop's list.
# Allowed before the deny policy is enabled, so a failure later in the firewall
# tasks can never lock you out of a remote host.
workstation_ufw_ssh_port: "22"

workstation_ufw_app_profiles:
  - KDEConnect

workstation_ufw_port_rules:
  - port: "22"
    proto: tcp
  # LocalSend (file transfer to phones/tablets) needs 53317 on both protocols.
  - port: "53317"
    proto: tcp
  - port: "53317"
    proto: udp

# Arch/Omarchy and Debian (trixie+) CLI/TUI tooling. Debian names differ where
# noted: github-cli -> gh, fd -> fd-find (binary is fdfind on Debian).
workstation_cli_packages_by_family:
  Archlinux:
    - fd
    - fzf
    - git
    - github-cli
    - jq
    - lazygit
    - neovim
    - unzip
    - wl-clipboard
    - yq
    - zip
    - zoxide
  Debian:
    - fd-find
    - fzf
    - git
    - gh
    - jq
    - lazygit
    - neovim
    - unzip
    - wl-clipboard
    - yq
    - zip
    - zoxide

# Espanso is not in the Arch official repos; the Wayland build lives in the AUR
# as espanso-wayland and is built with an AUR helper as the desktop user. The
# install is a one-time compile (guarded on the binary already existing), so it
# only pays the build cost on a fresh machine. An unattended build needs the
# desktop user to sudo without a prompt (the helper calls pacman); on a
# single-user Omarchy box that is the norm, otherwise run it once by hand.
workstation_aur_helper: yay
workstation_espanso_aur_package: espanso-wayland

# Systemd user services to enable after dotfiles are deployed. Override in
# host_vars to select which services are active on a given workstation.
workstation_systemd_user_services: []

# rclone Google Drive mount, the workstation twin of server_rclone_gdrive_*.
# Deploying the unit is safe on its own: it only starts once the remote has been
# authorised interactively with `rclone config`, and StartLimitBurst stops an
# unauthorised remote from crash-looping the user session.
workstation_rclone_gdrive_enabled: false
workstation_rclone_gdrive_remote: "Google Drive Perso"
workstation_rclone_gdrive_user: "{{ workstation_user }}"
workstation_rclone_gdrive_mount_point: "{{ workstation_home }}/Google Drive Perso"
workstation_rclone_gdrive_options:
  - --drive-skip-shortcuts
  - --vfs-cache-mode
  - full
  - --vfs-cache-max-age
  - 72h

# Chromium New Tab Page seeding.
#
# Set to true in host_vars to seed a custom homepage URL on first Chromium run.
# This controls the Home button only: there is no *preference* or command-line
# flag that redirects the new-tab page.
#
# There IS however a managed policy, NewTabPageLocation — see
# workstation_chromium_managed_policies below. That is the supported route and
# needs no extension; an earlier version of this comment said an extension was
# the only option, which was wrong.
workstation_chromium_defaults_enabled: false
workstation_chromium_new_tab_url: "https://homepage.dinnizer.com"
workstation_chromium_seeded_preferences:
  homepage: "{{ workstation_chromium_new_tab_url }}"
  homepage_is_newtab: false

# Chromium enterprise policies, written to /etc/chromium/policies/managed/.
# Chromium reads every *.json in that directory and merges them, so this writes
# its own file rather than one shared blob — the directory already contains a
# color.json managed elsewhere, and clobbering it would be rude.
#
# NewTabPageLocation is what actually redirects Ctrl+T; it is compiled into
# Chromium on Linux (verified against the installed binary, not assumed).
# Policies are read at startup, so Chromium must be restarted to pick up a
# change.
workstation_chromium_managed_policies: {}
workstation_chromium_policy_file: /etc/chromium/policies/managed/autoconfig.json
