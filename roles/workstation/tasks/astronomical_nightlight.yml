---
- name: Validate astronomical night-light coordinates
  ansible.builtin.assert:
    that:
      - workstation_astronomical_nightlight_latitude | float >= -90
      - workstation_astronomical_nightlight_latitude | float <= 90
      - workstation_astronomical_nightlight_longitude | float >= -180
      - workstation_astronomical_nightlight_longitude | float <= 180
      - workstation_astronomical_nightlight_temperature | int >= 1000
      - workstation_astronomical_nightlight_temperature | int <= 10000
    fail_msg: >-
      Astronomical night light requires valid latitude/longitude coordinates
      and a color temperature between 1000 K and 10000 K.

- name: Install wlsunset
  ansible.builtin.package:
    name: wlsunset
    state: present

- name: Stop the superseded astronomical night-light timer
  ansible.builtin.systemd:
    name: autoconfig-astronomical-nightlight.timer
    enabled: false
    state: stopped
    scope: user
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}/bus"

- name: Remove the superseded astronomical night-light timer
  ansible.builtin.file:
    path: "{{ workstation_home }}/.config/systemd/user/autoconfig-astronomical-nightlight.timer"
    state: absent

- name: Remove the superseded astronomical night-light controller
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/lib/autoconfig/astronomical-nightlight.py"
    state: absent

- name: Deploy the astronomical wlsunset user service
  ansible.builtin.template:
    src: autoconfig-astronomical-nightlight.service.j2
    dest: "{{ workstation_home }}/.config/systemd/user/autoconfig-astronomical-nightlight.service"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0644"

- name: Stop any running Hyprsunset instance
  ansible.builtin.command:
    argv:
      - pkill
      - -x
      - hyprsunset
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ workstation_user }}"

- name: Disable Hyprsunset's upstream user service
  ansible.builtin.systemd:
    name: hyprsunset.service
    enabled: false
    state: stopped
    scope: user
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}/bus"

- name: Enable and restart astronomical wlsunset
  ansible.builtin.systemd:
    name: autoconfig-astronomical-nightlight.service
    enabled: true
    state: restarted
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ (lookup('pipe', 'id -u ' ~ workstation_user)) }}/bus"
