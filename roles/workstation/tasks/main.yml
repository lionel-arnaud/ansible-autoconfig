---
# NOTE: The entire block is gated by workstation_enabled (default false).
# Set it to true in host_vars to activate this role on a new workstation.
- name: Configure the workstation (CLI/TUI, dotfiles, espanso)
  when: workstation_enabled | default(false)
  block:
    - name: Install workstation CLI/TUI packages
      ansible.builtin.import_tasks: cli_packages.yml
      when: workstation_cli_enabled | default(true)
      tags:
        - workstation_cli

    - name: Configure input remapping
      ansible.builtin.import_tasks: keyd.yml
      when: workstation_keyd_enabled | default(false)
      tags:
        - workstation_keyd

    - name: Configure the host firewall
      ansible.builtin.import_tasks: firewall.yml
      when: workstation_firewall_enabled | default(true)
      tags:
        - workstation_firewall

    - name: Apply workstation dotfiles
      ansible.builtin.import_tasks: dotfiles.yml
      when: workstation_dotfiles_enabled | default(true)
      tags:
        - workstation_dotfiles

    - name: Set up espanso
      ansible.builtin.import_tasks: espanso.yml
      when: workstation_espanso_enabled | default(false)
      tags:
        - workstation_espanso

    - name: Deploy Chromium managed policies
      ansible.builtin.import_tasks: chromium_policies.yml
      tags:
        - workstation_chromium

    - name: Configure the rclone Google Drive mount
      ansible.builtin.import_tasks: rclone_gdrive.yml
      when: workstation_rclone_gdrive_enabled | default(false)
      tags:
        - workstation_rclone_gdrive

    - name: Enable workstation user services
      ansible.builtin.import_tasks: systemd_user.yml
      when: workstation_systemd_user_services | default([]) | length > 0
      tags:
        - workstation_systemd
