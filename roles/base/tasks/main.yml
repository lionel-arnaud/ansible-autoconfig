---
# Base is the common foundation for every host. Only server-safe tasks belong here.
# lazydocker, starship, and dotfiles are opt-in via their respective flags.
# autopull always runs — every host must be self-managing via ansible-pull.
- name: Install the common package set
  ansible.builtin.import_tasks: common_packages.yml

- name: Keep ClamAV signatures current
  ansible.builtin.import_tasks: clamav.yml
  when: base_clamav_freshclam_enabled | bool
  tags:
    - base
    - clamav

- name: Update installed system Flatpaks
  ansible.builtin.import_tasks: flatpak.yml
  when: base_flatpak_system_updates_enabled | bool
  tags:
    - base
    - flatpak

- name: Install lazydocker
  ansible.builtin.import_tasks: lazydocker.yml
  when: base_lazydocker_enabled | default(false)
- name: Configure the Starship prompt
  ansible.builtin.import_tasks: starship_prompt.yml
  when: base_starship_prompt_enabled | default(false)
- name: Deploy the dotfiles
  ansible.builtin.import_tasks: dotfiles.yml
  when: base_dotfiles_enabled | default(false)
  tags:
    - dotfiles

- name: Create the dedicated fleet-pull controller key
  ansible.builtin.import_tasks: fleet_controller.yml
  when: autoconfig_fleet_controller_enabled | default(false)
  tags:
    - autoconfig
    - autoconfig_fleet

- name: Authorize the restricted fleet-pull trigger
  ansible.builtin.import_tasks: fleet_trigger.yml
  when: autoconfig_fleet_trigger_enabled | default(false)
  tags:
    - autoconfig
    - autoconfig_fleet
# Before autopull: the pull unit references autoconfig-notify@.service via
# OnFailure=, so the notifier must be installed first.
- name: Authenticate the GitHub CLI when a token is present
  ansible.builtin.import_tasks: gh_auth.yml
  when: gh_auth_enabled | default(true)
  tags:
    - gh

- name: Install the failure notification path
  ansible.builtin.import_tasks: notify.yml
  when: notify_enabled | default(false)
  tags:
    - notify

- name: Monitor local disk capacity
  ansible.builtin.import_tasks: disk_monitor.yml
  when:
    - disk_monitor_enabled | default(false)
    - notify_enabled | default(false)
  tags:
    - monitoring
    - disk

- name: Install the self-managing ansible-pull timer
  ansible.builtin.import_tasks: autopull.yml

- name: Authorize time-bounded manual ansible pulls
  ansible.builtin.import_tasks: manual_pull_authorization.yml
  when: autoconfig_manual_pull_authorization_enabled | bool
  tags:
    - autoconfig
