---
- name: Ensure the base role runs on supported hosts
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in base_packages_by_family
    fail_msg: >-
      base currently supports only these OS families:
      {{ base_packages_by_family.keys() | join(', ') }}.

- name: Load package plan for this OS family
  ansible.builtin.set_fact:
    base_cli_packages: >-
      {{ base_packages_by_family[ansible_facts.os_family].cli
         | difference(base_cli_packages_exclude | default([])) }}
    base_snap_packages: "{{ base_packages_by_family[ansible_facts.os_family].snaps }}"

- name: Detect Omarchy before distro package installs
  ansible.builtin.stat:
    path: /usr/bin/omarchy
  register: base_omarchy_binary
  when: ansible_facts.os_family == "Archlinux"

- name: Require explicit acknowledgement for Ansible package installs on Omarchy
  ansible.builtin.assert:
    that:
      - omarchy_allow_ansible_package_installs | bool
    fail_msg: >-
      This host looks like Omarchy. Prefer `omarchy pkg add` and `omarchy update`
      for app-level changes. Set omarchy_allow_ansible_package_installs: true only
      for baseline packages that Ansible should manage intentionally.
  when:
    - ansible_facts.os_family == "Archlinux"
    - base_omarchy_binary.stat.exists | default(false)

- name: Install common CLI packages for all hosts
  ansible.builtin.package:
    name: "{{ base_cli_packages }}"
    state: present

- name: Ensure snapd is enabled and running
  ansible.builtin.service:
    name: snapd
    state: started
    enabled: true
  when: base_snap_packages | length > 0

- name: Install common CLI snap packages
  community.general.snap:
    name: "{{ item }}"
    state: present
  loop: "{{ base_snap_packages }}"
  when: base_snap_packages | length > 0
