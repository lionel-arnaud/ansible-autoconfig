---
- name: Require fleet-pull trigger controller keys
  ansible.builtin.assert:
    that:
      - autoconfig_fleet_trigger_authorized_keys | length > 0
    fail_msg: >-
      autoconfig_fleet_trigger_authorized_keys is required when the restricted
      fleet-pull trigger is enabled.

- name: Ensure the fleet-pull user's SSH directory exists
  ansible.builtin.file:
    path: "{{ autoconfig_fleet_trigger_home }}/.ssh"
    state: directory
    owner: "{{ autoconfig_fleet_trigger_user }}"
    group: "{{ autoconfig_fleet_trigger_user }}"
    mode: "0700"

- name: Install the restricted fleet-pull command
  ansible.builtin.template:
    src: autoconfig-fleet-trigger.sh.j2
    dest: /usr/local/sbin/autoconfig-fleet-trigger
    owner: root
    group: root
    mode: "0755"

- name: Allow the restricted command to start the local pull
  ansible.builtin.template:
    src: autoconfig-fleet-trigger.sudoers.j2
    dest: /etc/sudoers.d/autoconfig-fleet-trigger
    owner: root
    group: root
    mode: "0440"
    validate: "{{ autoconfig_visudo_path }} -cf %s"

- name: Authorize the restricted fleet-pull controller keys
  ansible.builtin.lineinfile:
    path: "{{ autoconfig_fleet_trigger_home }}/.ssh/authorized_keys"
    create: true
    owner: "{{ autoconfig_fleet_trigger_user }}"
    group: "{{ autoconfig_fleet_trigger_user }}"
    mode: "0600"
    line: 'from="{{ item.source_address }}",no-agent-forwarding,no-port-forwarding,no-pty,no-user-rc,no-X11-forwarding,command="/usr/local/sbin/autoconfig-fleet-trigger" {{ item.public_key }}'
  loop: "{{ autoconfig_fleet_trigger_authorized_keys }}"
  no_log: true
