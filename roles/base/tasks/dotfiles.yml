---
- name: Ensure the dotfiles home exists
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}"
  register: dotfiles_home_stat

- name: Ensure the repository-managed dotfiles tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_source_dir }}"
  register: dotfiles_source_dir_stat

- name: Fail when the dotfiles target user home is missing
  ansible.builtin.assert:
    that:
      - dotfiles_home_stat.stat.exists
      - dotfiles_home_stat.stat.isdir
      - dotfiles_source_dir_stat.stat.exists
      - dotfiles_source_dir_stat.stat.isdir
    fail_msg: >-
      The dotfiles home {{ dotfiles_home }} or the source tree
      {{ dotfiles_source_dir }} is missing.

# Stow runs as dotfiles_user, so that user must be able to read the checkout. When
# ansible-pull is run as sudo without -d, it clones under /root (mode 700) and
# this fails with a cryptic chdir error. Catch it here with a clear message.
- name: Check the dotfiles source is reachable by the dotfiles user
  ansible.builtin.command:
    argv: [test, -r, "{{ dotfiles_source_dir }}"]
  become: true
  become_user: "{{ dotfiles_user }}"
  changed_when: false
  failed_when: false
  register: dotfiles_source_user_readable

- name: Fail clearly when the checkout is not readable by the dotfiles user
  ansible.builtin.assert:
    that:
      - dotfiles_source_user_readable.rc == 0
    fail_msg: >-
      {{ dotfiles_user }} cannot read {{ dotfiles_source_dir }} (Stow runs as that
      user). This usually means ansible-pull checked the repo out under /root. Run
      it against a shared, readable path, e.g. add: -d /opt/ansible-pull

- name: Ensure stowed dotfile targets remain writable by the desktop user
  ansible.builtin.file:
    path: "{{ dotfiles_source_dir }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    recurse: true

# NOTE: The bash and starship tasks below are legacy per-file tasks kept for
# readable git history. The generic shell loop further down covers all newer
# packages (ssh, opencode, claude, nvim, git, gh, ...).
# Intentionally kept (see docs/orchestrator/DECISIONS.md, 2026-06-15): the
# bash/starship branches document why the bashrc/starship symlinks get
# preserved-and-replaced on first run. Do not collapse into the generic loop
# without re-capturing that rationale in the loop itself.
- name: Check whether the existing bashrc is unmanaged
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.bashrc"
  register: dotfiles_bashrc_stat
  when: "'bash' in dotfiles_stow_packages"

- name: Resolve the existing bashrc symlink target
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ dotfiles_home }}/.bashrc"
  register: dotfiles_bashrc_link_target
  changed_when: false
  failed_when: false
  when:
    - "'bash' in dotfiles_stow_packages"
    - dotfiles_bashrc_stat.stat.islnk | default(false)

- name: Check whether a bashrc pre-stow backup already exists
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.bashrc.pre-stow-backup"
  register: dotfiles_bashrc_backup_stat
  when: "'bash' in dotfiles_stow_packages"

- name: Check whether the existing starship config is unmanaged
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.config/starship.toml"
  register: dotfiles_starship_stat
  when: "'starship' in dotfiles_stow_packages"

- name: Resolve the existing starship symlink target
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ dotfiles_home }}/.config/starship.toml"
  register: dotfiles_starship_link_target
  changed_when: false
  failed_when: false
  when:
    - "'starship' in dotfiles_stow_packages"
    - dotfiles_starship_stat.stat.islnk | default(false)

- name: Check whether a starship pre-stow backup already exists
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.config/starship.toml.pre-stow-backup"
  register: dotfiles_starship_backup_stat
  when: "'starship' in dotfiles_stow_packages"

# Preserve the previous file once, then let Stow own the canonical path. This
# avoids silent data loss while still making the first Stow run deterministic.
- name: Back up the unmanaged bashrc before Stow takes over
  ansible.builtin.copy:
    src: "{{ dotfiles_home }}/.bashrc"
    dest: "{{ dotfiles_home }}/.bashrc.pre-stow-backup"
    remote_src: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: preserve
  when:
    - "'bash' in dotfiles_stow_packages"
    - dotfiles_bashrc_stat.stat.exists
    - not dotfiles_bashrc_stat.stat.islnk | default(false)
    - not dotfiles_bashrc_backup_stat.stat.exists

- name: Remove the unmanaged bashrc so Stow can create its symlink
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.bashrc"
    state: absent
  when:
    - "'bash' in dotfiles_stow_packages"
    - dotfiles_bashrc_stat.stat.exists
    - >-
      (not dotfiles_bashrc_stat.stat.islnk | default(false))
      or
      (dotfiles_bashrc_stat.stat.islnk | default(false)
       and dotfiles_bashrc_link_target.stdout != dotfiles_source_dir ~ '/bash/.bashrc')

# Treat Starship the same way as bash: preserve the previous config once, then
# let Stow own the canonical path from the managed dotfiles checkout.
- name: Back up the unmanaged starship config before Stow takes over
  ansible.builtin.copy:
    src: "{{ dotfiles_home }}/.config/starship.toml"
    dest: "{{ dotfiles_home }}/.config/starship.toml.pre-stow-backup"
    remote_src: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: preserve
  when:
    - "'starship' in dotfiles_stow_packages"
    - dotfiles_starship_stat.stat.exists
    - not dotfiles_starship_stat.stat.islnk | default(false)
    - not dotfiles_starship_backup_stat.stat.exists

- name: Remove the unmanaged starship config so Stow can create its symlink
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.config/starship.toml"
    state: absent
  when:
    - "'starship' in dotfiles_stow_packages"
    - dotfiles_starship_stat.stat.exists
    - >-
      (not dotfiles_starship_stat.stat.islnk | default(false))
      or
      (dotfiles_starship_stat.stat.islnk | default(false)
       and dotfiles_starship_link_target.stdout != dotfiles_source_dir ~ '/starship/.config/starship.toml')

# Stow refuses to create a symlink when a real file already exists. This loop:
#   1. Skips if the path doesn't exist (fresh machine — nothing to rescue).
#   2. Skips if the path is already our Stow symlink (idempotent re-runs).
#   3. Otherwise: saves a one-time backup as <path>.pre-stow-backup, then removes
#      the original so Stow can place its symlink. The backup is never overwritten.
# The bashrc/starship-specific tasks above are kept for readable git history;
# this generic loop covers all other managed paths, including newer files in
# legacy packages such as bash/.inputrc.
# Keep the comments inside the shell block below free of apostrophes. Ansible
# splits the whole block as one argument string and counts quotes as it goes,
# so a lone apostrophe in a comment fails the parse with "unbalanced jinja2
# block or quotes" and takes the entire role down with it.
- name: Preserve unmanaged selected dotfiles before Stow takes over
  ansible.builtin.shell: |
    set -eu
    target='{{ dotfiles_home }}/{{ item.path }}'
    backup="$target.pre-stow-backup"

    # CASE 1: nothing at the target -> Stow can create it freely.
    if [ ! -e "$target" ] && [ ! -L "$target" ]; then echo NOOP; exit 0; fi

    # A host can hold more than one checkout of this repo: the ansible-pull timer
    # runs out of /opt/ansible-pull, while the operator runs the same playbook by
    # hand from a working tree under ~. Both stow the same packages, so a link
    # planted by one run legitimately points into the other checkout on the next.
    # Matching against the absolute path of whichever checkout is running made
    # each run treat the other symlink as unmanaged and fall through to CASE 4,
    # which does an unconditional rm -rf of the target. On savannarchome that
    # silently deleted and re-created ~27 paths
    # (.config/hypr, .config/nvim, .config/wireplumber ...) on every alternation,
    # with only a stale one-time backup standing between that and real data loss.
    # So recognise the link by its repo-relative tail instead of its full path.
    suffix="files/dotfiles/{{ item.package }}/{{ item.path }}"

    # CASE 2: target is already a Stow symlink into some checkout of this repo.
    if [ -L "$target" ]; then
      case "$(readlink -f "$target")" in
        */"$suffix") echo NOOP; exit 0 ;;
      esac
    fi

    # CASE 3: with --no-folding a managed directory is a REAL dir whose entries
    # are symlinks into the package source. If we find such a symlink, the path is
    # already managed -> leave it alone (otherwise we would wipe it every run).
    if [ -d "$target" ] && [ ! -L "$target" ]; then
      link=$(find "$target" -type l 2>/dev/null | head -n1)
      if [ -n "$link" ]; then
        case "$(readlink -f "$link")" in
          */"$suffix"/*) echo NOOP; exit 0 ;;
        esac
      fi
    fi

    # CASE 4: an unmanaged file/dir is in the way: back it up once, then remove it
    # so Stow can place its links. Emit CHANGED so Ansible reports this honestly.
    if [ ! -e "$backup" ] && [ ! -L "$backup" ]; then
      cp -a "$target" "$backup"
      chown -h '{{ dotfiles_user }}:{{ dotfiles_user }}' "$backup"
    fi
    rm -rf "$target"
    echo CHANGED
  args:
    executable: /bin/bash
  loop: "{{ dotfiles_managed_paths | selectattr('package', 'in', dotfiles_stow_packages) | list }}"
  # Per loop item, the item's own stdout is available here, so this flags changed
  # only when the script actually backed up/removed something.
  changed_when: "'CHANGED' in preserve_dotfiles.stdout"
  register: preserve_dotfiles
  when:
    - item.path not in ['.bashrc', '.config/starship.toml']

# A host can hold more than one checkout of this repo (ansible-pull's own clone
# under /opt/ansible-pull, and an operator's working tree under $HOME) and both
# stow the same packages. The "Preserve unmanaged..." loop above already learned
# to recognise a symlink from either checkout by its repo-relative tail instead
# of its full path, so it no longer destructively removes one just because this
# run's checkout differs from the one that created it (see the comment there).
#
# But that leniency stops at the Ansible layer: Stow itself does its own, separate
# ownership check when --restow runs, comparing the symlink's literal target
# against what THIS run's chdir (dotfiles_source_dir) says it should be. A
# symlink that correctly points at the other checkout still makes Stow abort the
# WHOLE package with "existing target is not owned by stow" — this has hit every
# package at least once since July (bash, git, nvim, hypr, ssh, systemd, scripts,
# espanso, claude, opencode, gh, lazygit, omarchy), and on 2026-09-11 it is what
# left ~/.bashrc deleted-and-never-recreated after the pre-step removed it.
#
# It also cannot be fully patched by extending dotfiles_managed_paths: that list
# only has ONE directory-level entry for packages like nvim/wireplumber, so the
# individual per-file symlinks Stow creates inside those directories (lazy-lock
# .json, init.lua, ...) are never enumerated or checked there at all.
#
# So repoint at the Stow layer instead: for each package, walk THIS run's own
# source tree (bounded by the package's file count, never the whole home dir —
# no need to worry about slow FUSE mounts like rclone's Google Drive or sshfs
# living under dotfiles_home, because this never descends into dotfiles_home at
# all until it has a specific target in hand) and for every file, compute the
# target Stow would manage. If that target is already a symlink resolving (by
# repo-relative tail, same match as the Preserve step) into files/dotfiles/
# <package>/ of ANY checkout, re-point it at THIS run's dotfiles_source_dir.
# This only ever rewrites a symlink's target, never touches content, and only
# fires once the resolved path is already confirmed to be the same repo file —
# so it cannot lose or overwrite anything, unlike --adopt. Walking the source
# tree instead of dotfiles_home also means it can only ever touch a path Stow
# itself would manage, never an unrelated symlink that happens to resolve into
# the repo (e.g. a hand-made *.bak marker pointing at an old checkout).
#
# `ln -sfr`, not a plain `ln -sfn`, to relink: Stow's own ownership check does
# not merely compare resolved paths, it distrusts absolute symlinks outright
# ("Ignoring an absolute symlink") and treats the target as still unmanaged.
# Confirmed by testing this against the actual conflicts in the log before
# writing it up — an absolute-target relink here left every `stow --restow`
# aborting exactly as before. Stow's own links are always relative, so this
# must create a relative link too, computed from the link's own directory.
- name: Repoint dotfile symlinks that belong to a different checkout of this repo
  ansible.builtin.shell: |
    set -eu
    package='{{ item }}'
    source_dir='{{ dotfiles_source_dir }}'
    home='{{ dotfiles_home }}'
    find "$source_dir/$package" -type f 2>/dev/null | while read -r src; do
      rel="${src#"$source_dir"/"$package"/}"
      link="$home/$rel"
      [ -L "$link" ] || continue
      resolved=$(readlink -f "$link") || continue
      case "$resolved" in
        */files/dotfiles/"$package"/"$rel")
          desired="$source_dir/$package/$rel"
          desired_rel=$(realpath --relative-to="$(dirname "$link")" "$desired")
          if [ "$(readlink "$link")" != "$desired_rel" ]; then
            ln -sfr "$desired" "$link"
            echo "CHANGED: $link"
          fi
          ;;
      esac
    done
  args:
    executable: /bin/bash
  loop: "{{ dotfiles_stow_packages }}"
  become: true
  become_user: "{{ dotfiles_user }}"
  register: dotfiles_repoint
  changed_when: "'CHANGED' in dotfiles_repoint.stdout"

# Stow remains the symlink engine, while Ansible decides which packages are safe
# to apply on this host.
#
# --no-folding is important: without it, Stow "folds" a whole package directory
# into a single directory symlink when the target dir does not pre-exist (e.g.
# ~/.config/gh -> repo/.../gh/.config/gh). That is dangerous here because the
# repo lives in the managed pull checkout: an app writing runtime state into that
# dir (gh writing hosts.yml with its OAuth token, nvim writing lazy state) would
# write straight into the git working tree. --no-folding keeps every directory a
# real local dir and symlinks only the individual managed files.
- name: Stow the selected dotfiles packages
  ansible.builtin.command:
    argv:
      - stow
      - --no-folding
      - --restow
      - --target
      - "{{ dotfiles_home }}"
      - "{{ item }}"
  args:
    chdir: "{{ dotfiles_source_dir }}"
  loop: "{{ dotfiles_stow_packages }}"
  become: true
  become_user: "{{ dotfiles_user }}"
  # --restow rebuilds the links every run, which also repairs any older folded
  # install and drops links for files removed from a package. That means stow
  # always "acts", but the net end state is stable/idempotent, so we report
  # unchanged rather than flag churn on every pull.
  changed_when: false

# After Stow rebuilds the dotfile symlinks, Hyprland's inotify watcher can
# surface a stale "cannot open ~/.config/hypr/hyprland.lua" overlay because
# the per-file mtime churn during Stow's --restow can race with the live
# compositor. Issuing `hyprctl reload` after Stow forces Hyprland to re-parse
# the new tree and dismisses any error overlay that surfaced mid-sync.
#
# Best-effort only: this task must NEVER break a sync. It runs only when:
#   - the hypr Stow package is in scope on this host, and
#   - hyprctl is installed and on PATH, and
#   - the command can reach a Hyprland instance (rc 0).
# Anything else silently no-ops via `register` + `failed_when: false`.
- name: Probe for hyprctl on the desktop user PATH
  ansible.builtin.command:
    argv: [command, -v, hyprctl]
  register: base_dotfiles_hyprctl_probe
  become: true
  become_user: "{{ dotfiles_user }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'hypr' in dotfiles_stow_packages"

- name: Reload Hyprland after dotfiles sync to clear stale inotify overlays
  ansible.builtin.command:
    argv: [hyprctl, reload]
  become: true
  become_user: "{{ dotfiles_user }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - "'hypr' in dotfiles_stow_packages"
    - base_dotfiles_hyprctl_probe is defined
    - base_dotfiles_hyprctl_probe.rc | default(1) == 0

# Secret dotfiles are stored vault-encrypted in the repo. Stow cannot manage them
# (a symlink would hand the application ciphertext), so they are copied into place
# instead. The copy module decrypts a vaulted source automatically as long as the
# vault password is available (--vault-password-file or ansible.cfg).
- name: Check whether the autoconfig vault password file is available
  ansible.builtin.stat:
    path: "{{ autoconfig_vault_password_file }}"
  register: autoconfig_vault_password_file_stat
  when: autoconfig_vault_password_file is defined and autoconfig_vault_password_file | length > 0

- name: Ensure parent directories for secret dotfiles exist
  ansible.builtin.file:
    path: "{{ (dotfiles_home ~ '/' ~ item.dest) | dirname }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "{{ item.dir_mode | default('0700') }}"
  loop: "{{ dotfiles_secret_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  when: autoconfig_vault_password_file_stat.stat.exists | default(false)

- name: Deploy vault-encrypted dotfiles (decrypted into place)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ dotfiles_home }}/{{ item.dest }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ dotfiles_secret_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  when: autoconfig_vault_password_file_stat.stat.exists | default(false)
