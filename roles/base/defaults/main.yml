---
# Keep common package names in one map so the base role stays portable across
# Debian-family and Arch-family hosts without splitting the whole role.
base_packages_by_family:
  Debian:
    cli:
      - curl
      - btop
      # GitHub CLI. Ubuntu ships it in universe, so no third-party apt repo and
      # no extra supply-chain surface; the tradeoff is a slightly older version
      # than upstream. Add GitHub's own repo only if a newer gh is actually
      # needed for something.
      - gh
      - python3-psutil
      - micro
      - fastfetch
      - pdfgrep
      - ncdu
      - mc
      - bat
      - clamav
      - rclone
      - cmatrix
      - eza
      - sl
      - starship
      - stow
      - snapd
      - tree
      - ripgrep
      - rsync
      - sqlite3
      - v4l-utils
      - ffmpeg
      - nethogs
      - fzf
      - fd-find
      - yq
      - lazygit
      - zoxide
      - pandoc
    # Keep the [] for as long as this list is empty; delete it once there is
    # at least one entry.
    snaps: []
    # - tldr
  Archlinux:
    cli:
      - curl
      - btop
      - github-cli
      - python-psutil
      - micro
      - fastfetch
      - pdfgrep
      - ncdu
      - mc
      - bat
      - clamav
      - rclone
      - cmatrix
      - eza
      - sl
      - starship
      - stow
      - tree
      - ripgrep
      - tldr
      - rsync
      - sqlite
      - v4l-utils
      - ffmpeg
      - nethogs
    snaps: []

# NOTE: Opt-in per host. False by default so unknown machines are never touched.
# To enable dotfiles on a new host, add to its host_vars:
#   base_dotfiles_enabled: true
#   dotfiles_stow_packages: [bash, starship, claude, ...]  # override if needed
# For a group of similar hosts, set the default in group_vars/<group> instead.
base_dotfiles_enabled: false
omarchy_allow_ansible_package_installs: false
dotfiles_user: "{{ desktop_user | default('lion') }}"
dotfiles_home: "/home/{{ dotfiles_user }}"
dotfiles_source_dir: "{{ playbook_dir }}/files/dotfiles"
# Default package list applied when a host does not override dotfiles_stow_packages.
# claude is intentionally included: it is a CLI tool valid on headless servers too.
dotfiles_stow_packages:
  - bash
  - starship
  - claude
# NOTE: This is the pre-stow backup guard, NOT the package registry.
# Stow will refuse to create a symlink if a real file already exists at the target.
# Every path that any Stow package will own must have an entry here so Ansible can
# preserve the pre-existing file as <path>.pre-stow-backup on the first run.
# Adding a new Stow package: (1) create files/dotfiles/<pkg>/..., (2) add it to
# dotfiles_stow_packages in the relevant host_vars, (3) add its path(s) here.
dotfiles_managed_paths:
  - package: bash
    path: .bashrc
  - package: bash
    path: .bashrc.local
  - package: bash
    path: .inputrc
  - package: starship
    path: .config/starship.toml
  - package: opencode
    path: .config/opencode/opencode.json
  # tui.json is the separate TUI config opencode split out of opencode.json
  # (theme, keybinds). It is listed on its own rather than widening the entry to
  # .config/opencode, because opencode writes runtime files into that same
  # directory (bun.lock, node_modules, the notifier state) that must stay local.
  - package: opencode
    path: .config/opencode/tui.json
  # The notifier plugin's own config. Its sibling opencode-notifier-state.json
  # is a turn counter the plugin rewrites constantly, so it stays unmanaged.
  - package: opencode
    path: .config/opencode/opencode-notifier.json
  - package: claude
    path: .claude/settings.json
  # ssh ships only the sanitized public config (it just Includes ~/.ssh/config.local).
  # The real host aliases live in the vaulted config.local (see dotfiles_secret_files).
  - package: ssh
    path: .ssh/config
  - package: nvim
    path: .config/nvim
  - package: git
    path: .config/git
  - package: gh
    path: .config/gh/config.yml
  - package: lazygit
    path: .config/lazygit/config.yml
  - package: hypr
    path: .config/hypr/autostart.lua
  - package: hypr
    path: .config/hypr/bindings.lua
  - package: hypr
    path: .config/hypr/hyprland.lua
  - package: hypr
    path: .config/hypr/monitors.lua
  - package: hypr
    path: .config/hypr/input.lua
  - package: hypr
    path: .config/hypr/looknfeel.lua
  - package: hypr
    path: .config/hypr
  - package: omarchy
    path: .config/omarchy/shell.json
  - package: omarchy
    path: .config/omarchy/plugins/lion.workspaces
  - package: wireplumber
    path: .config/wireplumber
  - package: systemd
    path: .config/systemd/user/audio-policy.service
  - package: systemd
    path: .config/systemd/user/freebox-mount.service
  # opencode-web.service and rclone-gdrive-mount.service are deliberately absent:
  # the server role templates those two units with the host's LAN IP and port, so
  # the systemd Stow package does not ship them and there is nothing for Stow to
  # collide with. Listing them here made this task rename the role's own unit to
  # .pre-stow-backup on every run, which the server role then re-templated.
  - package: scripts
    path: audio_policy.sh
  - package: scripts
    path: freebox.sh
  - package: scripts
    path: rclone_mount.sh
  - package: scripts
    path: serverannah_mount.sh
  - package: scripts
    path: packages.sh
  # espanso splits config and matches into separate subdirectories.
  - package: espanso
    path: .config/espanso/config/default.yml
  - package: espanso
    path: .config/espanso/match/base.yml

# Secret dotfiles cannot use Stow: a symlink would expose the vault ciphertext to
# the application instead of the real config. They are stored vault-encrypted in
# the repo and copied into place; Ansible decrypts them on the fly when the vault
# password is provided (see the Secrets And Vault section of the README). Each
# entry: src (absolute path to the encrypted file), dest (relative to the user
# home), and optional mode/dir_mode. Empty by default; hosts opt in.
dotfiles_secret_source_dir: "{{ playbook_dir }}/files/dotfiles-secret"
dotfiles_secret_files: []
base_starship_prompt_enabled: true

base_lazydocker_enabled: true
lazydocker_version: 0.25.0
lazydocker_install_dir: /usr/local/bin
lazydocker_install_path: "{{ lazydocker_install_dir }}/lazydocker"
lazydocker_arch_map:
  x86_64: x86_64
  amd64: x86_64
  aarch64: arm64
  arm64: arm64
  armv7l: armv7
  armv6l: armv6

autoconfig_repo_url: https://github.com/lionel-arnaud/ansible-autoconfig.git
autoconfig_branch: main
autoconfig_repo_dir: /opt/ansible-pull
autoconfig_playbook: local.yml
autoconfig_timer_name: autoconfig-pull
autoconfig_on_calendar: daily
autoconfig_randomized_delay: 30m
autoconfig_persistent: true
autoconfig_vault_password_file: "/home/{{ desktop_user | default('lion') }}/.ansible-vault-pass"

# Failure notifications (roles/base/tasks/notify.yml). Off by default so a new
# host does not start emitting alerts before anyone has subscribed to them.
notify_enabled: false
# Set in host_vars to use a topic you already subscribed to; empty means one is
# generated on the host instead.
notify_topic: ""
notify_base_url: https://ntfy.sh
notify_topic_file: /etc/ansible/secrets/notify-topic
notify_timeout_seconds: 20
notify_journal_lines: 40
# ntfy caps a message body; keep well under it so a long traceback still sends.
notify_body_max_bytes: 3500
# Prints the subscribe URL in the run output. Harmless on a laptop run, but the
# topic is a credential, so set it false once every phone is subscribed.
notify_show_subscribe_hint: true

# Hard cap on a single ansible-pull run. The serverannah run takes ~5 minutes;
# 45 lets a slow dist-upgrade finish while still catching a genuine hang.
autoconfig_pull_timeout: 45min

# Dead-man's switch. The ping URL is read from a FILE on the host, never from a
# variable here: it is a capability URL — anyone holding it can ping it and keep
# the alarm permanently silent — and this repository is public.
#
# /etc/ansible/secrets is in backup_paths, so the URL survives a rebuild.
#
# Deliberately NOT built on ntfy scheduled-message cancellation, despite the
# ntfy docs describing exactly that pattern. Tested against the free public
# server: DELETE returns HTTP 200 but the scheduled message still fires — it
# held in only one of three trials, including one with an 85-second margin. A
# watchdog that raises false "server is DOWN" alarms is worse than none, because
# you stop believing it.
#
# Point it at anything that alerts on a MISSING ping: an Uptime Kuma "Push"
# monitor (no signup, but it cannot detect its own host being down), or an
# external service such as healthchecks.io (which can).
heartbeat_url_file: /etc/ansible/secrets/heartbeat-pull-url
heartbeat_timeout_seconds: 20

# GitHub CLI authentication (roles/base/tasks/gh_auth.yml). Off unless a token
# file is present on the host; see that file for how to create one.
gh_auth_enabled: true
gh_token_file: /etc/ansible/secrets/gh-token
gh_auth_user: "{{ desktop_user | default('lion') }}"
