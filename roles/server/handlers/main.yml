---
- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

# Restarting the daemon bounces every container, so this is deliberately a
# handler: it fires only when /etc/docker/daemon.json actually changed, not on
# every run. Existing containers keep their original log settings until they are
# next recreated; the cap applies to new and recreated containers.
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Restart ScreenGuard server
  ansible.builtin.systemd_service:
    name: screenguard-server
    state: restarted
    daemon_reload: true

- name: Restart ScreenGuard web UI
  ansible.builtin.systemd_service:
    name: screenguard-webui
    state: restarted
