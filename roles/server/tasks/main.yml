---
# Keep the server task list explicit and flat so each service can be tested with
# tags and understood without chasing too much indirection.
- name: Install and configure Docker
  ansible.builtin.import_tasks: docker.yml
  tags:
    - server
    - server_docker

- name: Configure the network with netplan
  ansible.builtin.import_tasks: netplan.yml
  when: server_netplan_enabled | default(false)
  tags:
    - server
    - server_network

- name: Install Docker LAN-only published port guard
  ansible.builtin.template:
    src: autoconfig-docker-lan-guard.sh.j2
    dest: /usr/local/sbin/autoconfig-docker-lan-guard
    owner: root
    group: root
    mode: "0700"
  when: server_lan_only_published_ports | length > 0
  tags:
    - server
    - server_docker
    - firewall

- name: Install Docker LAN-only published port guard service
  ansible.builtin.copy:
    dest: /etc/systemd/system/autoconfig-docker-lan-guard.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Restrict selected Docker published ports to LAN clients
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/autoconfig-docker-lan-guard

      [Install]
      WantedBy=multi-user.target
  register: server_lan_guard_unit
  when: server_lan_only_published_ports | length > 0
  tags:
    - server
    - server_docker
    - firewall

# Asked before it is re-applied. "state: restarted" reports changed on every
# run by definition, so this task claimed to alter the firewall nightly while
# the guard script — which flushes and rebuilds its own chain, and tests with
# -C before inserting a jump — was already idempotent. The rules still get
# reasserted whenever they are genuinely missing, which is the case this
# guards against: Docker rewrites DOCKER-USER when it restarts.
- name: Check whether every Docker LAN guard rule is in place
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      missing=0
      for port in {{ server_lan_only_published_ports | join(' ') }}; do
        for proto in {{ server_lan_only_protocols | join(' ') }}; do
          iptables -C DOCKER-USER -p "$proto" -m conntrack \
            --ctorigdstport "$port" -j AUTOCONFIG-LAN-ONLY 2>/dev/null \
            || missing=$((missing + 1))
        done
      done
      # A jump into a chain that does not exist protects nothing.
      iptables -S AUTOCONFIG-LAN-ONLY >/dev/null 2>&1 || missing=$((missing + 1))
      # And nothing beyond what is wanted: a port removed from the list must
      # trigger a re-apply, or its old rule is never cleaned up.
      expected={{ (server_lan_only_published_ports | length) * (server_lan_only_protocols | length) }}
      actual=$(iptables -S DOCKER-USER 2>/dev/null | grep -c -- '-j AUTOCONFIG-LAN-ONLY' || true)
      [ "$actual" -eq "$expected" ] || missing=$((missing + 1))
      echo "$missing"
  register: server_lan_guard_missing
  changed_when: false
  check_mode: false
  when: server_lan_only_published_ports | length > 0
  tags:
    - server
    - server_docker
    - firewall

- name: Enable the Docker LAN-only published port guard service
  ansible.builtin.systemd:
    name: autoconfig-docker-lan-guard.service
    enabled: true
    daemon_reload: "{{ server_lan_guard_unit.changed }}"
  when: server_lan_only_published_ports | length > 0
  tags:
    - server
    - server_docker
    - firewall

- name: Re-apply the Docker LAN-only published port guard
  ansible.builtin.systemd:
    name: autoconfig-docker-lan-guard.service
    state: restarted
  when:
    - server_lan_only_published_ports | length > 0
    - server_lan_guard_unit is changed
      or (server_lan_guard_missing.stdout | default('1') | trim | int) > 0
  tags:
    - server
    - server_docker
    - firewall

- name: Provide a backup inbox for pushes from other hosts
  ansible.builtin.import_tasks: backup_inbox.yml
  when: backup_inbox_enabled | default(false)
  tags:
    - server
    - backup

- name: Configure Timeshift system snapshots
  ansible.builtin.import_tasks: timeshift.yml
  when: server_timeshift_enabled | default(false)
  tags:
    - server
    - timeshift

- name: Configure the storage mounts
  ansible.builtin.import_tasks: mounts.yml
  when: server_manage_fstab | default(false)
  tags:
    - server
    - server_mounts

- name: Configure fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: server_fail2ban_enabled | default(false)
  tags:
    - server
    - fail2ban

- name: Configure the Borg backups
  ansible.builtin.import_tasks: backup.yml
  when: server_backup_enabled | default(false)
  tags:
    - server
    - backup

# Must precede Homepage: Homepage's docker.yaml points at this proxy by service
# name, so the proxy has to exist before Homepage starts reading from it.
- name: Deploy the filtered Docker socket proxy
  ansible.builtin.import_tasks: docker_socket_proxy.yml
  when: server_docker_socket_proxy_enabled | default(false)
  tags:
    - server
    - server_docker
    - docker_socket_proxy

- name: Deploy Homepage
  ansible.builtin.import_tasks: homepage.yml
  when: server_homepage_enabled | default(false)
  tags:
    - server
    - homepage

- name: Deploy BentoPDF
  ansible.builtin.import_tasks: bentopdf.yml
  when: server_bentopdf_enabled | default(false)
  tags:
    - server
    - bentopdf

- name: Deploy the game timer
  ansible.builtin.import_tasks: game_timer.yml
  when: server_game_timer_enabled | default(false)
  tags:
    - server
    - game_timer

- name: Deploy Dinnizer
  ansible.builtin.import_tasks: dinnizer.yml
  when: server_dinnizer_enabled | default(false)
  tags:
    - server
    - dinnizer

- name: Deploy Excalidraw
  ansible.builtin.import_tasks: excalidraw.yml
  when: server_excalidraw_enabled | default(false)
  tags:
    - server
    - excalidraw

- name: Deploy Jellyfin
  ansible.builtin.import_tasks: jellyfin.yml
  when: server_jellyfin_enabled | default(false)
  tags:
    - server
    - jellyfin

# Nextcloud and Frigate follow a two-phase pattern: the preflight task checks
# hardware/storage availability and sets a fact; the main task only runs when
# both the feature flag AND the preflight fact are true. This prevents the
# deployment from failing on a machine where the required disk is not yet mounted.
- name: Deploy Uptime Kuma
  ansible.builtin.import_tasks: uptime_kuma.yml
  when: server_uptime_kuma_enabled | default(false)
  tags:
    - server
    - uptime_kuma

- name: Check whether Nextcloud storage is available
  ansible.builtin.import_tasks: nextcloud_preflight.yml
  when: server_nextcloud_enabled | default(false)
  tags:
    - server
    - nextcloud

- name: Deploy Nextcloud
  ansible.builtin.import_tasks: nextcloud.yml
  when:
    - server_nextcloud_enabled | default(false)
    - nextcloud_storage_mount_available | default(false)
  tags:
    - server
    - nextcloud

- name: Check whether the Frigate camera is available
  ansible.builtin.import_tasks: frigate_preflight.yml
  when: server_frigate_enabled | default(false)
  tags:
    - server
    - frigate

- name: Deploy Frigate
  ansible.builtin.import_tasks: frigate.yml
  when:
    - server_frigate_enabled | default(false)
    - frigate_runtime_available | default(false)
  tags:
    - server
    - frigate

- name: Deploy Pi-hole
  ansible.builtin.import_tasks: pihole.yml
  when: server_pihole_enabled | default(false)
  tags:
    - server
    - pihole

- name: Deploy AuMenuIlYA
  ansible.builtin.import_tasks: aumenuilya.yml
  when: server_aumenuilya_enabled | default(false)
  tags:
    - server
    - aumenuilya

- name: Deploy opencode web
  ansible.builtin.import_tasks: opencode.yml
  when: server_opencode_enabled | default(false)
  tags:
    - server
    - opencode

- name: Configure the rclone Google Drive mount
  ansible.builtin.import_tasks: rclone_gdrive.yml
  when: server_rclone_gdrive_enabled | default(false)
  tags:
    - server
    - rclone_gdrive

- name: Deploy the Caddy reverse proxy
  ansible.builtin.import_tasks: reverse_proxy.yml
  when: server_reverse_proxy_enabled | default(false)
  tags:
    - server
    - reverse_proxy
