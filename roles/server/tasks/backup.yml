---
- name: Gather minimal facts for Borg backups
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Require a supported OS family for Borg backups
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in backup_packages_by_family
    fail_msg: >-
      Borg backup packages are not defined for {{ ansible_facts.os_family }}.
      Add this OS family to backup_packages_by_family.

- name: Install Borg backup packages
  ansible.builtin.package:
    name: "{{ backup_packages_by_family[ansible_facts.os_family] }}"
    state: present

- name: Check whether the Borg backup target mount is active
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ backup_required_mount }}"
  register: backup_required_mount_state
  changed_when: false
  failed_when: false

- name: Require the Borg backup target mount to be active
  ansible.builtin.assert:
    that:
      - backup_required_mount_state.rc == 0
    fail_msg: >-
      {{ backup_required_mount }} is not mounted. Refusing to create a Borg
      repository on the root filesystem.

- name: Ensure Borg backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ backup_root_dir }}"
    - "{{ backup_dump_dir }}"
    - "{{ backup_secret_dir }}"
    - "{{ backup_repo_dir }}"

- name: Check whether the Borg passphrase exists
  ansible.builtin.stat:
    path: "{{ backup_borg_passphrase_file }}"
  register: backup_borg_passphrase_file_stat
  no_log: true

# NOTE: The passphrase is generated on the managed host and stored only in
# backup_borg_passphrase_file (/etc/ansible/secrets/borg-passphrase). It is
# never stored in this repo. Back up that file separately — losing it means
# losing access to all Borg archives.
- name: Generate the Borg passphrase on the target host
  ansible.builtin.shell: "tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48"
  register: backup_borg_passphrase_generated
  changed_when: true
  when: not backup_borg_passphrase_file_stat.stat.exists
  no_log: true

- name: Save the generated Borg passphrase
  ansible.builtin.copy:
    content: "{{ backup_borg_passphrase_generated.stdout }}\n"
    dest: "{{ backup_borg_passphrase_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not backup_borg_passphrase_file_stat.stat.exists
  no_log: true

- name: Install Borg backup runner script
  ansible.builtin.copy:
    dest: /usr/local/sbin/autoconfig-borg-backup
    owner: root
    group: root
    mode: "0700"
    content: |
      #!/bin/sh
      set -eu

      export BORG_REPO='{{ backup_repo_dir }}'
      export BORG_PASSPHRASE="$(cat '{{ backup_borg_passphrase_file }}')"
      export BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=no
      export BORG_RELOCATED_REPO_ACCESS_IS_OK=no

      dump_dir='{{ backup_dump_dir }}'
      mkdir -p "$dump_dir"
      chmod 700 "$dump_dir"

      # A missing container or password file used to make this block skip the
      # dump silently and let the backup report success — you would only find
      # out at restore time, which is the worst possible moment. A typo in a
      # container name now stops the run instead.
      #
      # Each dump is written to a temp file and moved into place only once it is
      # non-empty, so a failed dump can never truncate the previous good one:
      # `> file` opens and empties the target before the command even starts.
      {% for dump in backup_database_dumps %}
      if ! docker inspect '{{ dump.container }}' >/dev/null 2>&1; then
        echo "FATAL: dump '{{ dump.name }}' names container '{{ dump.container }}', which does not exist" >&2
        exit 1
      fi
      if [ ! -f '{{ dump.password_file }}' ]; then
        echo "FATAL: dump '{{ dump.name }}' has no password file at '{{ dump.password_file }}'" >&2
        exit 1
      fi
      dump_tmp="$dump_dir/{{ dump.name }}.sql.partial"
      {% if dump.engine | default('mariadb') == 'postgres' %}
      docker exec -e PGPASSWORD="$(cat '{{ dump.password_file }}')" '{{ dump.container }}' pg_dump -U'{{ dump.user }}' '{{ dump.database }}' > "$dump_tmp"
      {% else %}
      docker exec '{{ dump.container }}' mariadb-dump -u'{{ dump.user }}' -p"$(cat '{{ dump.password_file }}')" '{{ dump.database }}' > "$dump_tmp"
      {% endif %}
      if [ ! -s "$dump_tmp" ]; then
        echo "FATAL: dump '{{ dump.name }}' produced an empty file" >&2
        rm -f "$dump_tmp"
        exit 1
      fi
      chmod 600 "$dump_tmp"
      mv "$dump_tmp" "$dump_dir/{{ dump.name }}.sql"
      {% endfor %}

      # Consistent snapshots of every live SQLite database in the backup set.
      #
      # A SQLite database in WAL mode is two files that only agree with each
      # other at a single instant. Copied raw while a service writes, the
      # archive can pair a database with a log from a different moment, which
      # may not open on restore; Borg notices and warns, which is how Uptime
      # Kuma failed the run of 19 September. Jellyfin, Pi-hole and opencode
      # carry the same risk. sqlite3 .backup takes a consistent copy of a live
      # database without stopping the service that writes it.
      #
      # Discovered rather than listed, so the next service with a SQLite
      # database is covered without anyone remembering to add it. A raw copy
      # is excluded only once its snapshot has succeeded: if a snapshot fails,
      # the raw files stay in the archive and a warning is raised, so a
      # database is never silently dropped from the backup.
      sqlite_dir="$dump_dir/sqlite"
      sqlite_excludes="$dump_dir/sqlite-excludes"
      rm -rf "$sqlite_dir"
      mkdir -p "$sqlite_dir"
      chmod 700 "$sqlite_dir"
      : > "$sqlite_excludes"
      for root in {% for path in backup_paths %}'{{ path }}' {% endfor %}; do
        find "$root" -type f -name '*-wal' 2>/dev/null
      done | while IFS= read -r wal; do
        db="${wal%-wal}"
        [ -f "$db" ] || continue
        snap="$sqlite_dir$db"
        mkdir -p "$(dirname "$snap")"
        if sqlite3 "$db" ".timeout 30000" ".backup '$snap'" \
           && sqlite3 "$snap" "PRAGMA journal_mode=DELETE;" >/dev/null \
           && [ -s "$snap" ]; then
          printf 'fm:%s\nfm:%s-wal\nfm:%s-shm\n' "$db" "$db" "$db" >> "$sqlite_excludes"
          echo "sqlite snapshot: $db"
        else
          rm -f "$snap"
          echo "WARNING: could not snapshot $db, so its raw files stay in the archive" >&2
        fi
      done

      if ! borg info "$BORG_REPO" >/dev/null 2>&1; then
        borg init --encryption=repokey "$BORG_REPO"
      fi

      archive="{{ inventory_hostname }}-$(date +%Y-%m-%dT%H-%M-%S)"

      # Borg exit codes: 0 success, 1 warning, 2 or more error. A warning still
      # writes a complete archive. Under set -e it used to end the script right
      # here, which skipped prune, compact and the off-site sync, so one file
      # changing mid-read cost that night the off-site copy. Only a real error
      # stops the run now; a warning is reported at the end, after the work.
      set +e
      borg create --stats --compression zstd,6 \
        --exclude-from "$sqlite_excludes" \
      {% for path in backup_exclude_paths | default([]) %}
        --exclude '{{ path }}' \
      {% endfor %}
        "$BORG_REPO::$archive" \
      {% for path in backup_paths %}
        '{{ path }}' \
      {% endfor %}
        "$dump_dir"
      create_rc=$?
      set -e
      # The snapshots are in the archive now; keeping them would only double
      # the disk used by every database.
      rm -rf "$sqlite_dir"
      if [ "$create_rc" -ge 2 ]; then
        echo "FATAL: borg create failed with exit code $create_rc" >&2
        exit "$create_rc"
      fi

      borg prune --list "$BORG_REPO" \
        --keep-daily={{ backup_retention_keep_daily }} \
        --keep-weekly={{ backup_retention_keep_weekly }} \
        --keep-monthly={{ backup_retention_keep_monthly }}

      borg compact "$BORG_REPO"

      {% if backup_offsite_enabled | default(false) %}
      # Off-site copy. Every other copy of this data is in one room: the main
      # SSD, the backup disk, the Timeshift disk. One fire, theft or flood takes
      # all of them, so the repo is mirrored to cloud storage after compaction.
      #
      # Safe to sync a Borg repo with a plain mirror: segments are append-only
      # and immutable, so an incremental run transfers only new segments, and
      # the deletions that `borg prune` + `borg compact` just made propagate
      # correctly. Syncing *after* compact (not before) means the remote never
      # holds segments the local repo has already dropped.
      #
      # --config is explicit and non-negotiable: this script runs as root, while
      # the Google Drive token belongs to the desktop user, so root's own empty
      # rclone config would otherwise be used and the remote would appear to not
      # exist.
      if [ -r '{{ backup_offsite_rclone_config }}' ]; then
        rclone sync "$BORG_REPO" '{{ backup_offsite_remote }}:{{ backup_offsite_path }}' \
          --config '{{ backup_offsite_rclone_config }}' \
          --transfers {{ backup_offsite_transfers }} \
          --checksum \
      {% if backup_offsite_bwlimit %}
          --bwlimit '{{ backup_offsite_bwlimit }}' \
      {% endif %}
          --stats-one-line --stats 60s
      else
        echo "WARNING: off-site sync skipped, no readable rclone config at {{ backup_offsite_rclone_config }}" >&2
      fi
      {% endif %}

      if [ "$create_rc" -ne 0 ]; then
        echo "WARNING: borg create reported warnings (exit $create_rc); the archive, prune, compact and off-site sync all completed" >&2
        exit "$create_rc"
      fi

- name: Install Borg backup systemd service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ backup_timer_name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run autoconfig Borg backup
      Requires=docker.service
      After=network-online.target docker.service
      {% if notify_enabled | default(false) %}
      OnFailure=autoconfig-notify@%n.service
      {% endif %}

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/autoconfig-borg-backup
      TimeoutStartSec={{ backup_timeout }}

- name: Install Borg backup systemd timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ backup_timer_name }}.timer"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run autoconfig Borg backup timer

      [Timer]
      OnCalendar={{ backup_timer_on_calendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Ensure Borg backup timer is enabled and running
  ansible.builtin.systemd:
    name: "{{ backup_timer_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
