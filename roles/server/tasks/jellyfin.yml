---
- name: Ensure Jellyfin secret directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Jellyfin runs as a fixed UID inside the linuxserver.io image (UID 1000 in
# the jellyfin user account). Bind-mount the config and cache into the host
# so the state survives image upgrades. Selected SSD media directories are
# mounted read-only because media files are not mutated by the server.
- name: Ensure Jellyfin config directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_config_dir }}"
    state: directory
    owner: "{{ jellyfin_puid | string }}"
    group: "{{ jellyfin_pgid | string }}"
    mode: "0755"

- name: Ensure Jellyfin cache directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_cache_dir }}"
    state: directory
    owner: "{{ jellyfin_puid | string }}"
    group: "{{ jellyfin_pgid | string }}"
    mode: "0755"

# Generate the admin password on the target host on first run. Mode 0600
# because it's the only credential into Jellyfin.
- name: Check whether the Jellyfin admin password file exists
  ansible.builtin.stat:
    path: "{{ jellyfin_admin_password_file }}"
  register: jellyfin_admin_password_file_stat
  no_log: true

- name: Generate the Jellyfin admin password on the target host
  ansible.builtin.shell: "tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32"
  register: jellyfin_admin_password_generated
  changed_when: true
  when: not jellyfin_admin_password_file_stat.stat.exists
  no_log: true

- name: Save the generated Jellyfin admin password
  ansible.builtin.copy:
    content: "{{ jellyfin_admin_password_generated.stdout }}\n"
    dest: "{{ jellyfin_admin_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not jellyfin_admin_password_file_stat.stat.exists
  no_log: true

- name: Read the managed Jellyfin admin password
  ansible.builtin.slurp:
    src: "{{ jellyfin_admin_password_file }}"
  register: jellyfin_admin_password_read
  no_log: true

- name: Load the Jellyfin admin username and password
  ansible.builtin.set_fact:
    jellyfin_admin_username: "{{ jellyfin_admin_username }}"
    jellyfin_admin_password: "{{ jellyfin_admin_password_read.content | b64decode | trim }}"
  no_log: true

- name: Ensure Jellyfin container network exists
  community.docker.docker_network:
    name: "{{ jellyfin_network_name }}"
    state: present

- name: Pull Jellyfin image
  community.docker.docker_image:
    name: "{{ jellyfin_image }}"
    source: pull
    force_source: true
  register: jellyfin_image_pull

# Jellyfin Honors the standard HTTP creds header for the Web UI. We bind
# 8096 to the LAN address so the family can hit Jellyfin from the home
# network without going through the public DNS. Public access for the Jellyfin
# web client goes through Caddy on 443 (jelly.dinnizer.com), which proxies to
# jellyfin:8096 inside the docker network — Jellyfin clients then authenticate
# via Jellyfin's own user DB, not via Caddy basic auth.
- name: Run Jellyfin container
  community.docker.docker_container:
    name: "{{ jellyfin_container_name }}"
    image: "{{ jellyfin_image }}"
    state: started
    recreate: "{{ jellyfin_image_pull.changed }}"
    restart_policy: unless-stopped
    published_ports: "{{ jellyfin_published_ports }}"
    # Strict, stated rather than inherited. Removing 8920 from the list above
    # did not recreate the container: the default comparison did not count a
    # port that is published but no longer wanted as a difference, so the
    # port stayed open while its LAN-only guard rule was correctly removed.
    comparisons:
      published_ports: strict
      volumes: strict
    networks:
      - name: "{{ jellyfin_network_name }}"
    env:
      PUID: "{{ jellyfin_puid | string }}"
      PGID: "{{ jellyfin_pgid | string }}"
      TZ: "{{ jellyfin_timezone }}"
    volumes: >-
      {{
        [
          jellyfin_config_dir ~ ':/config',
          jellyfin_cache_dir ~ ':/cache'
        ] + jellyfin_media_volumes
      }}
  no_log: true

# Jellyfin's first-run wizard needs to complete before any library or user
# API calls will work. Poll /System/Info/Public until the daemon answers,
# then check whether StartupWizardCompleted is true yet.
- name: Wait for Jellyfin to answer HTTP requests
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/System/Info/Public"
    status_code: 200
    validate_certs: false
    timeout: 10
  register: jellyfin_public_info
  until: jellyfin_public_info.status | default(0) == 200
  retries: 30
  delay: 5
  changed_when: false

# --- First-run wizard ---------------------------------------------------
# Jellyfin exposes the same wizard endpoints the UI uses. We poke each one
# in the order the UI would. The endpoint shapes changed across versions
# (10.11 made /Startup/FirstUser GET-only and rejected POST with 405), so
# every call is best-effort with failed_when: false. Whichever calls
# succeed are real progress; whichever don't just mean we need the user
# to finish the wizard in the Web UI.
- name: Jellyfin first-run configuration (locale + country)
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Startup/Configuration"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    body_format: json
    body:
      UICulture: "fr-FR"
      MetadataCountryCode: "FR"
      PreferredMetadataLanguage: "fr"
    status_code: -1
    validate_certs: false
    timeout: 15
  register: jellyfin_config_step
  changed_when: false
  failed_when: false

- name: Jellyfin first-run admin user (best effort — endpoint shape varies by version)
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Startup/FirstUser"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    body_format: json
    body:
      Name: "{{ jellyfin_admin_username }}"
      Password: "{{ jellyfin_admin_password }}"
    status_code: -1
    validate_certs: false
    timeout: 15
  register: jellyfin_user_step
  changed_when: false
  failed_when: false

# Some 10.11.x variants renamed this to /Startup/CreateUser or split the
# wizard into numbered steps (POST /Startup/FirstUser?step=2). Try the
# numbered variant — harmless if the endpoint doesn't exist.
- name: Jellyfin first-run admin user (numbered-step fallback)
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Startup/FirstUser?step=2"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    body_format: json
    body:
      Name: "{{ jellyfin_admin_username }}"
      Password: "{{ jellyfin_admin_password }}"
    status_code: -1
    validate_certs: false
    timeout: 15
  register: jellyfin_user_step_2
  changed_when: false
  failed_when: false

- name: Jellyfin remote access (allow external clients)
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Startup/RemoteAccess"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    body_format: json
    body:
      EnableRemoteAccess: true
      EnableAutomaticPortMapping: false
    status_code: -1
    validate_certs: false
    timeout: 15
  register: jellyfin_remote_step
  changed_when: false
  failed_when: false

# Check whether the wizard completed successfully. /System/Info/Public
# returns StartupWizardCompleted=false until the user finishes the Web UI
# wizard. The library-seed task below skips itself in that case so the
# role re-runs idempotently once the wizard is done.
- name: Read Jellyfin wizard completion flag
  ansible.builtin.set_fact:
    jellyfin_wizard_complete: "{{ jellyfin_public_info.json.StartupWizardCompleted | default(false) }}"

# The library-seed block needs an authenticated user. Until the wizard is
# complete, this fails (404 from /Users, 401 from /Users/AuthenticateByName).
# Tell the user once, then skip silently on every re-run.
- name: Print Jellyfin admin password + wizard reminder
  ansible.builtin.debug:
    msg: >-
      Jellyfin admin password for {{ jellyfin_admin_username }} is stored at
      {{ jellyfin_admin_password_file }} on the host.
      Wizard complete: {{ jellyfin_wizard_complete }}.
      If false: open https://jelly.dinnizer.com/web and complete the wizard,
      then re-run ansible-pull to seed the libraries.
  no_log: false

# Once the admin user exists, subsequent API calls require an auth header
# of the form "MediaBrowser Client=..., Device=..., DeviceId=...,
# Token=<access-token-from-Users-AuthenticateByName>".
#
# Jellyfin 12.0 dropped the legacy X-Emby-Authorization and X-MediaBrowser-Token
# headers — both pre-auth challenge and post-auth calls now go through the
# standard Authorization: MediaBrowser ... header (RFC 7235). The X-Emby form
# returns 400 "Error processing request" with no body; X-MediaBrowser-Token
# returns 401. Tested on serverannah against jellyfin/jellyfin:12.0.0.
- name: Jellyfin API key for service-to-service calls
  # /Auth/Keys in 12.0 expects the app name as a QUERY PARAMETER, not in the
  # JSON body — sending {"App": "..."} returns 400 "The app field is required"
  # because the controller's [FromQuery] binding is what populates the field.
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Auth/Keys?app=ansible-autoconfig"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    status_code: 204
    validate_certs: false
    timeout: 10
  register: jellyfin_api_key_resp
  changed_when: jellyfin_api_key_resp.status | default(0) == 204
  failed_when: false
  when: jellyfin_wizard_complete | bool

# --- Library seeding ---------------------------------------------------
# Use the /Library/VirtualFolders endpoint to add each entry. Jellyfin's
# VirtualFolders API requires the user to be authenticated with an access
# token; the simplest path after first-run is to authenticate by name and
# harvest an AccessToken (short-lived, fine for the role run).
- name: Jellyfin user access token for seeding
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Users/AuthenticateByName"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: >-
        MediaBrowser Client="autoconfig",
        Device="ansible",
        DeviceId="autoconfig-ansible",
        Version="0.1"
    body_format: json
    body:
      Username: "{{ jellyfin_admin_username }}"
      Pw: "{{ jellyfin_admin_password }}"
    status_code: 200
    validate_certs: false
    timeout: 10
  register: jellyfin_access_resp
  # Authenticating is a read: it fetches a token for the seeding tasks below,
  # which report their own changes. Reporting success as a change made every
  # run look like it had reconfigured the media server.
  changed_when: false
  no_log: true
  when: jellyfin_wizard_complete | bool

- name: Read current Jellyfin libraries (for idempotency)
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Library/MediaFolders"
    method: GET
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_access_resp.json.AccessToken | default('''') }}"'
    status_code: 200
    validate_certs: false
    timeout: 10
  register: jellyfin_current_libs_resp
  changed_when: false
  failed_when: false
  no_log: true
  when: jellyfin_wizard_complete | bool

- name: Set the canonical Jellyfin library name list (for prune filter)
  ansible.builtin.set_fact:
    jellyfin_canonical_names: "{{ jellyfin_libraries | default([]) | map(attribute='name') | list }}"
  when: jellyfin_wizard_complete | bool

- name: Set the current Jellyfin virtual folder list (idempotency base)
  # /Library/MediaFolders returns the built-in "Playlists" virtual folder
  # alongside user-created libraries. Both report IsFolder=true so the
  # obvious filter doesn't work — match by name instead.
  ansible.builtin.set_fact:
    jellyfin_current_vfolders: "{{ jellyfin_current_libs_resp.json.Items | default([]) | rejectattr('Name', 'equalto', 'Playlists') | list }}"
  when: jellyfin_wizard_complete | bool

- name: Create Jellyfin libraries on first run
  # Jellyfin 10.11 expects Name / CollectionType / Paths / RefreshOptions
  # as QUERY PARAMETERS on POST /Library/VirtualFolders, not in the JSON body.
  # Same endpoint, same body schema documented at api.jellyfin.org, but
  # the [FromQuery] binding on the controller in 10.11 means the body
  # fields are ignored and a JSON body with the same field names just
  # produces "The name field is required" — the deserializer sees an
  # empty form.
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Library/VirtualFolders?Name={{ item.name | urlencode }}&CollectionType={{ item.collection_type }}&Paths={{ item.paths | join(',') | urlencode }}&RefreshOptions=true"
    method: POST
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_access_resp.json.AccessToken | default('''') }}"'
    status_code: 204
    validate_certs: false
    timeout: 30
  register: jellyfin_lib_create
  changed_when: jellyfin_lib_create.status | default(0) == 204
  failed_when: false
  loop: "{{ jellyfin_libraries | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.collection_type }} -> {{ item.paths | join(', ') }})"
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_access_resp.status | default(0) == 200
    - jellyfin_current_vfolders | selectattr('Name', 'equalto', item.name) | list | length == 0

# The previous Plex-style block on serverannah used Movies as collection
# type=movies (single path /data/Movies) and TV Shows as collection
# type=show (/data/TV Shows). Jellyfin's PUT /Library/VirtualFolders
# doesn't exist, so to migrate to the new schema we have to delete
# the old library and recreate it. Best-effort — errors here mean the
# library has already been migrated or the user removed it manually.
- name: Prune Jellyfin libraries that have been renamed or retyped
  # Delete any virtual folder whose Name is not in jellyfin_libraries.
  # Covers two failure modes:
  #  1. Old Movies( type=movies) library still in the DB from when the
  #     role set type=movies; now jellyfin_libraries has type=mixed so the
  #     rename-and-retype is "delete old, create new".
  #  2. Stray duplicates that previous runs of the role created while the
  #     idempotency filter was wrong.
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/Library/VirtualFolders?itemid={{ item.Id }}&refresh=false&Name={{ item.Name | urlencode }}"
    method: DELETE
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_access_resp.json.AccessToken | default('''') }}"'
    status_code: 204
    validate_certs: false
    timeout: 30
  register: jellyfin_lib_delete
  changed_when: jellyfin_lib_delete.status | default(0) == 204
  failed_when: false
  loop: "{{ jellyfin_current_vfolders | rejectattr('Name', 'in', jellyfin_canonical_names) | list }}"
  loop_control:
    label: "delete {{ item.Name }}"
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_access_resp.status | default(0) == 200

# Safety net for duplicates that survived the API DELETE. Jellyfin's
# /Library/VirtualFolders DELETE endpoint returns 204 even for items it
# can't actually delete (CanDelete=false on system-managed collections);
# those rows remain in BaseItems and reappear in the Web UI on next
# refresh. The role now goes to the SQLite DB directly to clean those up.
# Stops Jellyfin so it can't write its in-memory state back over the
# changes, then restarts.
- name: List remaining duplicate Jellyfin libraries via SQLite (post-API-prune)
  ansible.builtin.command:
    cmd: >-
      sqlite3 {{ jellyfin_config_dir }}/data/data/jellyfin.db
      "SELECT Id, Name FROM BaseItems
       WHERE Type = 'MediaBrowser.Controller.Entities.CollectionFolder'
         AND Name NOT IN ('Movies', 'TV Shows', 'Music', 'Photos', 'Playlists')"
  register: jellyfin_db_orphans
  changed_when: false
  when: jellyfin_wizard_complete | bool

- name: Stop Jellyfin before editing its database
  ansible.builtin.command:
    cmd: docker stop jellyfin
  register: jellyfin_stopped
  changed_when: true
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_db_orphans.stdout_lines | default([]) | length > 0

- name: Remove duplicate Jellyfin CollectionFolders via SQLite (direct DB)
  ansible.builtin.command:
    cmd: >-
      sqlite3 {{ jellyfin_config_dir }}/data/data/jellyfin.db
      "DELETE FROM AncestorIds WHERE ItemId IN
        (SELECT Id FROM BaseItems
         WHERE Type = 'MediaBrowser.Controller.Entities.CollectionFolder'
           AND Name NOT IN ('Movies', 'TV Shows', 'Music', 'Photos', 'Playlists'));
       DELETE FROM BaseItems
       WHERE Type = 'MediaBrowser.Controller.Entities.CollectionFolder'
         AND Name NOT IN ('Movies', 'TV Shows', 'Music', 'Photos', 'Playlists')"
  register: jellyfin_db_delete
  changed_when: true
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_db_orphans.stdout_lines | default([]) | length > 0

- name: Restart Jellyfin after DB cleanup
  ansible.builtin.command:
    cmd: docker start jellyfin
  register: jellyfin_restarted
  changed_when: true
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_db_orphans.stdout_lines | default([]) | length > 0

- name: Wait for Jellyfin to come back up after DB cleanup
  ansible.builtin.uri:
    url: "http://{{ jellyfin_lan_ip | default('192.168.1.100') }}:8096/System/Info/Public"
    status_code: 200
    validate_certs: false
    timeout: 10
  register: jellyfin_public_info_post
  until: jellyfin_public_info_post.status | default(0) == 200
  retries: 30
  delay: 3
  changed_when: false
  when:
    - jellyfin_wizard_complete | bool
    - jellyfin_db_orphans.stdout_lines | default([]) | length > 0
