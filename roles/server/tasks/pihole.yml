---
- name: Ensure Pi-hole root-managed directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pihole_root_dir }}"

- name: Validate the selected Pi-hole deployment mode
  ansible.builtin.assert:
    that:
      - pihole_mode in pihole_mode_profiles
    fail_msg: >-
      Unsupported Pi-hole mode {{ pihole_mode }}. Choose one of
      {{ pihole_mode_profiles.keys() | list | join(', ') }}.

- name: Ensure Pi-hole secret directory exists
  ansible.builtin.file:
    path: "{{ pihole_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Pi-hole updates files under /etc/pihole itself, so Ansible should avoid
# resetting ownership there on every run.
- name: Ensure Pi-hole runtime configuration directory exists
  ansible.builtin.file:
    path: "{{ pihole_config_dir }}"
    state: directory
    mode: "0755"

# Custom local DNS records. Pi-hole v6 stores these in the
# `[dns] hosts = [...]` array of /etc/pihole/pihole.toml, not in the legacy
# /etc/pihole/custom.list (which is autogenerated by FTL and gets wiped on
# every Pi-hole restart). The role rewrites the hosts line in-place from
# pihole_custom_dns_records and sends SIGHUP to pihole-FTL to reload the
# config without a container restart — fast (~1s) and avoids disturbing
# upstream DNS state.
# Pi-hole has two `hosts = [...]` arrays — one under [dns] for local A records
# and one under [dhcp] for static DHCP leases. We slice the file at the [dns]
# section boundary so the regex only matches inside [dns], and use Python
# directly (ansible.builtin.replace has no DOTALL flag exposed).
#
# The program is passed as a literal block scalar and the records arrive as one
# JSON argv entry, not through Jinja interpolation. A folded scalar (`>-`)
# cannot be used here: YAML keeps the newline before any *more-indented*
# continuation line, which would hand `python3 -c` a string starting with
# leading whitespace and blow up with IndentationError. Passing the records via
# argv also keeps them out of the regex replacement, where a backslash would
# otherwise be read as a group reference.
#
# The comparison is on the *parsed* record list, not on the rendered text:
# pihole-FTL rewrites pihole.toml in its own style (one record per line) every
# time it saves its config, so a literal text compare would report "changed" on
# every run and SIGHUP the daemon for nothing.
- name: Replace the [dns] hosts line in pihole.toml
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import pathlib
        import re
        import sys

        path = pathlib.Path(sys.argv[1])
        wanted = ['%s %s' % (r['ip'], r['name']) for r in json.loads(sys.argv[2])]

        text = path.read_text()
        start = text.find('[dns]')
        if start == -1:
            sys.exit('no [dns] section in %s' % path)
        end = text.find('[dhcp]', start)
        if end == -1:
            end = len(text)
        section = text[start:end]

        match = re.search(
            r'(\s*hosts\s*=\s*)(\[.*?\])(\s*###.*)?$',
            section,
            flags=re.DOTALL | re.MULTILINE,
        )
        if match is None:
            sys.exit('no [dns] hosts array in %s' % path)
        # Exit 0 means "already correct"; exit 9 means "file rewritten". This
        # gives Ansible honest change reporting so the SIGHUP below only fires
        # when the records actually moved.
        if re.findall(r'"([^"]*)"', match.group(2)) == wanted:
            sys.exit(0)

        rendered = '[' + ', '.join(json.dumps(h) for h in wanted) + ']'
        section = (section[:match.start()] + match.group(1) + rendered
                   + (match.group(3) or '') + section[match.end():])
        path.write_text(text[:start] + section + text[end:])
        sys.exit(9)
      - "{{ pihole_config_dir }}/pihole.toml"
      - "{{ pihole_custom_dns_records | to_json }}"
  register: pihole_custom_dns_records_render
  changed_when: pihole_custom_dns_records_render.rc == 9
  failed_when: pihole_custom_dns_records_render.rc not in [0, 9]
  when: pihole_custom_dns_records | length > 0

- name: Signal pihole-FTL to reload its config
  community.docker.docker_container_exec:
    container: "{{ pihole_container_name }}"
    command: kill -HUP 1
  register: pihole_ftl_reload
  when:
    - pihole_custom_dns_records_render is defined
    - pihole_custom_dns_records_render.changed | bool
  # The SIGHUP reload is idempotent on Pi-hole's side; the `changed_when: false`
  # keeps ansible-pull from reporting it as a change every time the role runs.
  changed_when: false

- name: Ensure Pi-hole hosts directory exists
  ansible.builtin.file:
    path: "{{ pihole_config_dir }}/hosts"
    state: directory
    mode: "0755"

- name: Check whether Pi-hole web password file exists
  ansible.builtin.stat:
    path: "{{ pihole_web_password_file }}"
  register: pihole_web_password_file_stat
  no_log: true

- name: Generate Pi-hole web password on the target host
  ansible.builtin.shell: "tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32"
  register: pihole_web_password_generated
  changed_when: true
  when: not pihole_web_password_file_stat.stat.exists
  no_log: true

- name: Save generated Pi-hole web password
  ansible.builtin.copy:
    content: "{{ pihole_web_password_generated.stdout }}\n"
    dest: "{{ pihole_web_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not pihole_web_password_file_stat.stat.exists
  no_log: true

- name: Read Pi-hole web password from the managed secret file
  ansible.builtin.slurp:
    src: "{{ pihole_web_password_file }}"
  register: pihole_web_password_slurp
  no_log: true

- name: Load Pi-hole web password
  ansible.builtin.set_fact:
    pihole_web_password: "{{ pihole_web_password_slurp.content | b64decode | trim }}"
  no_log: true

- name: Ensure Pi-hole container network exists
  community.docker.docker_network:
    name: "{{ pihole_network_name }}"
    state: present

- name: Check whether the extracted Pi-hole adlist file exists
  ansible.builtin.stat:
    path: "{{ pihole_adlists_file }}"
  register: pihole_adlists_file_stat
  when: pihole_policy_import_enabled | bool

- name: Check whether the extracted Pi-hole exact allowlist file exists
  ansible.builtin.stat:
    path: "{{ pihole_allowlist_exact_file }}"
  register: pihole_allowlist_file_stat
  when: pihole_policy_import_enabled | bool

- name: Require extracted Pi-hole policy files when import is enabled
  ansible.builtin.assert:
    that:
      - pihole_adlists_file_stat.stat.exists
      - pihole_allowlist_file_stat.stat.exists
    fail_msg: Pi-hole policy import is enabled but the extracted backup files are missing.
  when: pihole_policy_import_enabled | bool

# Keep the DNS service on the host, but let the admin UI stay private behind the
# reverse proxy so websites and Pi-hole do not compete for extra host web ports.
- name: Pull Pi-hole image
  community.docker.docker_image:
    name: "{{ pihole_image }}"
    source: pull
    force_source: true
  register: pihole_image_pull

- name: Run Pi-hole container
  community.docker.docker_container:
    name: "{{ pihole_container_name }}"
    image: "{{ pihole_image }}"
    state: started
    recreate: "{{ pihole_image_pull.changed }}"
    restart_policy: unless-stopped
    published_ports: "{{ pihole_published_ports }}"
    networks:
      - name: "{{ pihole_network_name }}"
    volumes:
      - "{{ pihole_config_dir }}:/etc/pihole"
    capabilities: "{{ pihole_capabilities }}"
    env:
      TZ: "{{ pihole_timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
      FTLCONF_dns_listeningMode: "{{ pihole_dns_listening_mode }}"
      FTLCONF_dns_upstreams: "{{ pihole_dns_upstreams | join(';') }}"
      FTLCONF_dns_domain: "{{ pihole_dns_domain }}"
      FTLCONF_dns_piholePTR: "{{ pihole_dns_ptr_mode }}"
      FTLCONF_dns_domainNeeded: "{{ pihole_dns_domain_needed | ternary('true', 'false') }}"
      FTLCONF_dns_expandHosts: "{{ pihole_dns_expand_hosts | ternary('true', 'false') }}"
      FTLCONF_dns_bogusPriv: "{{ pihole_dns_bogus_priv | ternary('true', 'false') }}"
      FTLCONF_dns_queryLogging: "{{ pihole_dns_query_logging | ternary('true', 'false') }}"
      FTLCONF_dns_EDNS0ECS: "{{ pihole_dns_edns0_ecs | ternary('true', 'false') }}"
  no_log: true

- name: Collect LAN-bound Pi-hole published IPs
  ansible.builtin.set_fact:
    pihole_bind_ips: "{{ (pihole_bind_ips | default([])) + [item.split(':')[0]] }}"
  loop: "{{ pihole_published_ports }}"
  when: item is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:')

# Docker can try to restart LAN-IP-bound containers before DHCP has restored the
# address, and occasionally restore Pi-hole as running but detached from its
# Docker network. This helper waits for the explicit bind IP, reconnects the
# network if needed, then restarts Pi-hole so DNS has a working route.
- name: Install Pi-hole network-online starter service
  ansible.builtin.copy:
    dest: /etc/systemd/system/autoconfig-pihole-start.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Start the autoconfig Pi-hole container after the LAN address exists
      Requires=docker.service
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      {% for bind_ip in pihole_bind_ips | default([]) | unique %}
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip -4 addr show | grep -q "{{ bind_ip }}/" && exit 0; sleep 2; done; exit 1'
      {% endfor %}
      ExecStart=/bin/sh -c '/usr/bin/docker network connect {{ pihole_network_name }} {{ pihole_container_name }} 2>/dev/null || true; /usr/bin/docker restart {{ pihole_container_name }}'

      [Install]
      WantedBy=multi-user.target
  register: pihole_starter_unit

- name: Enable and run Pi-hole network-online starter service
  ansible.builtin.systemd:
    name: autoconfig-pihole-start.service
    enabled: true
    state: "{{ pihole_starter_unit.changed | ternary('restarted', 'started') }}"
    daemon_reload: "{{ pihole_starter_unit.changed }}"

- name: Wait for Pi-hole gravity.db to be present
  ansible.builtin.stat:
    path: "{{ pihole_config_dir }}/gravity.db"
  register: pihole_gravity_db_stat
  retries: 30
  delay: 2
  until: pihole_gravity_db_stat.stat.exists
  when: pihole_policy_import_enabled | bool

- name: Prepare SQL-safe Pi-hole import comment
  ansible.builtin.set_fact:
    pihole_import_comment_sql: >-
      {{ pihole_import_comment | replace("'", "''") }}
  when: pihole_policy_import_enabled | bool

- name: Calculate the desired Pi-hole policy hash
  ansible.builtin.shell: |
    set -eu
    cat "{{ pihole_adlists_file }}" "{{ pihole_allowlist_exact_file }}" | sha256sum | cut -d' ' -f1
  args:
    executable: /bin/bash
  register: pihole_policy_hash
  changed_when: false
  when: pihole_policy_import_enabled | bool

- name: Check whether a previous Pi-hole policy hash exists
  ansible.builtin.stat:
    path: "{{ pihole_policy_hash_file }}"
  register: pihole_policy_hash_file_stat
  when: pihole_policy_import_enabled | bool

- name: Read the previous Pi-hole policy hash
  ansible.builtin.slurp:
    src: "{{ pihole_policy_hash_file }}"
  register: pihole_policy_hash_existing
  when:
    - pihole_policy_import_enabled | bool
    - pihole_policy_hash_file_stat.stat.exists

# The imported entries are tagged with a dedicated comment so future runs can
# update or prune only the Ansible-managed subset without disturbing manual UI
# changes the family may add later.
# Pi-hole/FTL can keep gravity.db locked briefly right after the container starts.
# Keep SQLite's own wait short, then let Ansible retry the whole idempotent import.
- name: Import Pi-hole adlists from the extracted backup
  ansible.builtin.shell: |
    set -eu
    db="{{ pihole_config_dir }}/gravity.db"
    file="{{ pihole_adlists_file }}"
    marker="{{ pihole_import_comment_sql }}"
    changes=0
    while IFS= read -r address; do
      [ -n "$address" ] || continue
      esc_address=${address//\'/\'\'}
      delta=$(sqlite3 -cmd '.timeout 1000' "$db" "INSERT INTO adlist(address, enabled, comment) VALUES('$esc_address', 1, '$marker') ON CONFLICT(address, type) DO UPDATE SET enabled=1, comment='$marker' WHERE enabled != 1 OR IFNULL(comment, '') != '$marker'; SELECT changes();")
      changes=$((changes + delta))
    done < "$file"
    while IFS='|' read -r id address; do
      [ -n "$id" ] || continue
      if ! grep -Fxq "$address" "$file"; then
        delta=$(sqlite3 -cmd '.timeout 1000' "$db" "DELETE FROM adlist WHERE id=$id; SELECT changes();")
        changes=$((changes + delta))
      fi
    done < <(sqlite3 -cmd '.timeout 1000' -separator '|' "$db" "SELECT id, address FROM adlist WHERE comment='$marker';")
    printf '%s\n' "$changes"
  args:
    executable: /bin/bash
  register: pihole_adlist_import
  changed_when: (pihole_adlist_import.stdout | trim | int) > 0
  retries: 5
  delay: 1
  until: pihole_adlist_import.rc == 0
  when:
    - pihole_policy_import_enabled | bool
    - not pihole_policy_hash_file_stat.stat.exists or (pihole_policy_hash_existing.content | b64decode | trim) != (pihole_policy_hash.stdout | trim)

# Pi-hole/FTL can keep gravity.db locked briefly right after the container starts.
# Keep SQLite's own wait short, then let Ansible retry the whole idempotent import.
- name: Import Pi-hole exact allowlist from the extracted backup
  ansible.builtin.shell: |
    set -eu
    db="{{ pihole_config_dir }}/gravity.db"
    file="{{ pihole_allowlist_exact_file }}"
    marker="{{ pihole_import_comment_sql }}"
    changes=0
    while IFS= read -r domain; do
      [ -n "$domain" ] || continue
      esc_domain=${domain//\'/\'\'}
      delta=$(sqlite3 -cmd '.timeout 1000' "$db" "INSERT INTO domainlist(type, domain, enabled, comment) VALUES(0, '$esc_domain', 1, '$marker') ON CONFLICT(domain, type) DO UPDATE SET enabled=1, comment='$marker' WHERE enabled != 1 OR IFNULL(comment, '') != '$marker'; SELECT changes();")
      changes=$((changes + delta))
    done < "$file"
    while IFS='|' read -r id domain; do
      [ -n "$id" ] || continue
      if ! grep -Fxq "$domain" "$file"; then
        delta=$(sqlite3 -cmd '.timeout 1000' "$db" "DELETE FROM domainlist WHERE id=$id; SELECT changes();")
        changes=$((changes + delta))
      fi
    done < <(sqlite3 -cmd '.timeout 1000' -separator '|' "$db" "SELECT id, domain FROM domainlist WHERE type=0 AND comment='$marker';")
    printf '%s\n' "$changes"
  args:
    executable: /bin/bash
  register: pihole_allowlist_import
  changed_when: (pihole_allowlist_import.stdout | trim | int) > 0
  retries: 5
  delay: 1
  until: pihole_allowlist_import.rc == 0
  when:
    - pihole_policy_import_enabled | bool
    - not pihole_policy_hash_file_stat.stat.exists or (pihole_policy_hash_existing.content | b64decode | trim) != (pihole_policy_hash.stdout | trim)

- name: Restart Pi-hole after policy import changes
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ pihole_container_name }}"
  changed_when: true
  when:
    - pihole_policy_import_enabled | bool
    - pihole_adlist_import.changed or pihole_allowlist_import.changed

- name: Record the imported Pi-hole policy hash
  ansible.builtin.copy:
    content: "{{ pihole_policy_hash.stdout | trim }}\n"
    dest: "{{ pihole_policy_hash_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - pihole_policy_import_enabled | bool
    - not pihole_policy_hash_file_stat.stat.exists or (pihole_policy_hash_existing.content | b64decode | trim) != (pihole_policy_hash.stdout | trim)

- name: Apply the managed kids Pi-hole client profile
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import sqlite3
        import sys

        db, enabled, name, clients_json, allow_json = sys.argv[1:]
        enabled = enabled == "true"
        clients = json.loads(clients_json)
        allow = json.loads(allow_json)
        marker = f"Managed by ansible Pi-hole client policy: {name}"
        conn = sqlite3.connect(db, timeout=10)
        conn.execute("PRAGMA foreign_keys = ON")
        before = conn.total_changes

        with conn:
            row = conn.execute(
                "SELECT id FROM 'group' WHERE name = ?", (name,)
            ).fetchone()
            if not enabled:
                conn.execute(
                    "DELETE FROM domainlist_by_group WHERE domainlist_id IN "
                    "(SELECT id FROM domainlist WHERE comment = ?)",
                    (marker,),
                )
                conn.execute(
                    "DELETE FROM domainlist WHERE comment = ?", (marker,)
                )
                if row is not None:
                    group_id = row[0]
                    conn.execute(
                        "DELETE FROM client_by_group WHERE group_id = ?",
                        (group_id,),
                    )
                    conn.execute("DELETE FROM 'group' WHERE id = ?", (group_id,))
            else:
                if row is None:
                    conn.execute(
                        "INSERT INTO 'group'(enabled, name, description) "
                        "VALUES(1, ?, ?)",
                        (name, "Restricted children device profile managed by Ansible"),
                    )
                    group_id = conn.execute(
                        "SELECT id FROM 'group' WHERE name = ?", (name,)
                    ).fetchone()[0]
                else:
                    group_id = row[0]
                    conn.execute(
                        "UPDATE 'group' SET enabled = 1, description = ? WHERE id = ?",
                        ("Restricted children device profile managed by Ansible", group_id),
                    )

                client_ids = []
                for client in clients:
                    conn.execute(
                        "INSERT INTO client(ip, comment) VALUES(?, ?) "
                        "ON CONFLICT(ip) DO NOTHING",
                        (client, marker),
                    )
                    client_id = conn.execute(
                        "SELECT id FROM client WHERE ip = ?", (client,)
                    ).fetchone()[0]
                    client_ids.append(client_id)
                    conn.execute(
                        "INSERT OR IGNORE INTO client_by_group(client_id, group_id) "
                        "VALUES(?, ?)",
                        (client_id, group_id),
                    )

                placeholders = ",".join("?" for _ in client_ids) or "NULL"
                conn.execute(
                    "DELETE FROM client_by_group WHERE group_id = ? AND client_id "
                    f"NOT IN ({placeholders})",
                    [group_id, *client_ids],
                )

                rules = [(3, ".*"), *((2, rule) for rule in allow)]
                rule_ids = []
                for rule_type, domain in rules:
                    conn.execute(
                        "INSERT INTO domainlist(type, domain, enabled, comment) "
                        "VALUES(?, ?, 1, ?) ON CONFLICT(domain, type) DO UPDATE "
                        "SET enabled = 1, comment = excluded.comment",
                        (rule_type, domain, marker),
                    )
                    domainlist_id = conn.execute(
                        "SELECT id FROM domainlist WHERE type = ? AND domain = ?",
                        (rule_type, domain),
                    ).fetchone()[0]
                    rule_ids.append(domainlist_id)
                    # Pi-hole adds every new domain rule to Default. Remove
                    # that implicit link before assigning this client-only rule.
                    conn.execute(
                        "DELETE FROM domainlist_by_group WHERE domainlist_id = ? "
                        "AND group_id != ?",
                        (domainlist_id, group_id),
                    )
                    conn.execute(
                        "INSERT OR IGNORE INTO domainlist_by_group(domainlist_id, group_id) "
                        "VALUES(?, ?)",
                        (domainlist_id, group_id),
                    )

                placeholders = ",".join("?" for _ in rule_ids)
                stale = conn.execute(
                    "SELECT domainlist_id FROM domainlist_by_group WHERE group_id = ? "
                    f"AND domainlist_id NOT IN ({placeholders})",
                    [group_id, *rule_ids],
                ).fetchall()
                conn.execute(
                    "DELETE FROM domainlist_by_group WHERE group_id = ? "
                    f"AND domainlist_id NOT IN ({placeholders})",
                    [group_id, *rule_ids],
                )
                for (domainlist_id,) in stale:
                    conn.execute(
                        "DELETE FROM domainlist WHERE id = ? AND comment = ? "
                        "AND NOT EXISTS (SELECT 1 FROM domainlist_by_group "
                        "WHERE domainlist_id = ?)",
                        (domainlist_id, marker, domainlist_id),
                    )

        print("changed" if conn.total_changes != before else "ok")
      - "{{ pihole_config_dir }}/gravity.db"
      - "{{ pihole_kids_profile_enabled | ternary('true', 'false') }}"
      - "{{ pihole_kids_profile_name }}"
      - "{{ pihole_kids_profile_clients | to_json }}"
      - "{{ pihole_kids_profile_allow_regex | to_json }}"
  register: pihole_kids_profile
  changed_when: pihole_kids_profile.stdout | trim == 'changed'
  retries: 5
  delay: 1
  until: pihole_kids_profile.rc == 0

- name: Restart Pi-hole after kids profile changes
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ pihole_container_name }}"
  changed_when: true
  when: pihole_kids_profile.changed
