---
# The server role now owns only server-specific packages; common packages moved
# to roles/base so base can safely run on all hosts.
server_docker_packages_by_family:
  Debian:
    docker:
      - docker.io
      - python3-docker
  Archlinux:
    docker:
      - docker
      - python-docker
# Falls back through dotfiles_user → desktop_user → 'lion' to stay consistent
# with whichever variable the calling host actually defines.
# Docker daemon configuration. The log caps are the important part: json-file
# is unbounded by default, so 10m x 3 files per container bounds total container
# log growth at roughly 540 MB across the current 18 services instead of letting
# it grow until the root filesystem fills.
server_docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"

server_docker_users:
  - "{{ dotfiles_user | default(desktop_user | default('lion')) }}"
# Protocols the LAN-only guard filters. Frigate publishes 8555 on both TCP and
# UDP (WebRTC), so filtering TCP alone left a real hole.
server_lan_only_protocols:
  - tcp
  - udp

server_lan_cidrs:
  - 192.168.1.0/24
server_lan_only_published_ports: []
server_netplan_enabled: false
server_netplan_file: /etc/netplan/00-installer-config.yaml
server_netplan_config: ""

server_homepage_enabled: false
# Filtered read-only Docker socket proxy (see tasks/docker_socket_proxy.yml).
# Everything defaults to denied; only the endpoints Homepage reads are enabled,
# and POST stays 0 so nothing behind the proxy can create or exec a container.
server_docker_socket_proxy_enabled: false
server_docker_socket_proxy_image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
server_docker_socket_proxy_container_name: docker-socket-proxy
server_docker_socket_proxy_network_name: autoconfig-services
server_docker_socket_proxy_port: 2375
server_docker_socket_proxy_env:
  CONTAINERS: "1"
  SERVICES: "0"
  TASKS: "0"
  IMAGES: "0"
  NETWORKS: "0"
  VOLUMES: "0"
  INFO: "0"
  # VERSION stays allowed: Docker clients call /version to negotiate an API
  # version before anything else, and Homepage's container list breaks without
  # it. It discloses only the daemon version, to something already inside the
  # internal network. Verified against the running proxy: /containers/json 200,
  # /images/json 403, POST /containers/create 403, POST /containers/<c>/exec 403.
  VERSION: "1"
  POST: "0"

homepage_container_name: homepage
homepage_image: ghcr.io/gethomepage/homepage:latest
homepage_root_dir: /opt/homepage
homepage_config_dir: /opt/homepage/config
homepage_source_dir: "{{ role_path }}/../../files/homepage/opt/homepage/"
homepage_network_name: autoconfig-services
homepage_port: 3000
# Published ports for the Homepage container. Override in host_vars to bind the
# LAN address instead of 0.0.0.0 — Caddy reaches Homepage over the shared Docker
# network by service name, so the published port is only for direct LAN access
# and never needs to be world-bound.
# Extra bind mounts for the Homepage container, e.g. the disks its resources
# widget reports on. Homepage reads usage from INSIDE its own container, so a
# path listed in widgets.yaml but not mounted here renders as "API Error".
# Host-specific paths belong in host_vars, so this stays empty by default.
homepage_extra_volumes: []

homepage_published_ports:
  - "{{ homepage_port }}:3000"
homepage_allowed_hosts:
  - "{{ inventory_hostname }}:{{ homepage_port }}"
  - "{{ ansible_hostname | default(inventory_hostname) }}:{{ homepage_port }}"
homepage_extra_allowed_hosts: []

server_bentopdf_enabled: false
bentopdf_container_name: bentopdf
bentopdf_image: ghcr.io/alam00000/bentopdf-simple:latest
bentopdf_network_name: autoconfig-services
bentopdf_port: 8080

server_game_timer_enabled: false
# tabletop-timer.com is a plain static HTML/CSS/JS site (no build step). Its
# source is its own PUBLIC repo, which the server clones directly — there is no
# vendored snapshot in this repo anymore. To deploy a change: push the game-timer
# repo, then re-run the autoconfig pull (which re-clones it).
game_timer_repo_url: https://github.com/lionel-arnaud/game-timer.git
game_timer_repo_version: main
game_timer_root_dir: /opt/game-timer
# Where the repo is cloned, and the curated dir nginx actually serves.
game_timer_src_dir: "{{ game_timer_root_dir }}/src"
game_timer_site_dir: "{{ game_timer_root_dir }}/site"
# Repo paths that must NOT be served: git metadata (security) and dev-only dirs.
# Everything else in the repo root is published to the site dir.
game_timer_deploy_excludes:
  - .git
  - main
  - newTimerParadigm
  - README.md
game_timer_container_name: game-timer
game_timer_image: nginx:alpine
game_timer_network_name: autoconfig-services
game_timer_published_ports: []

server_toki_suli_enabled: false
# toki.suli.dinnizer.com is a plain static HTML/CSS/JS + WAV site (no build
# step) — a Toki Pona whistle-synthesis learning guide and trainer. Source is
# a public fork of github.com/gliese1337/toki-suli, cloned directly on the
# server. To deploy a change: push the toki-suli repo, then re-run the
# autoconfig pull (which re-clones it).
toki_suli_repo_url: https://github.com/lionel-arnaud/toki-suli.git
toki_suli_repo_version: main
toki_suli_root_dir: /opt/toki-suli
# Where the repo is cloned, and the curated dir nginx actually serves.
toki_suli_src_dir: "{{ toki_suli_root_dir }}/src"
toki_suli_site_dir: "{{ toki_suli_root_dir }}/site"
# Repo paths that must NOT be served: git metadata (security), the TypeScript
# source/build tooling, and node_modules (none of these are needed to serve
# the static guide/trainer). Everything else in the repo root is published.
toki_suli_deploy_excludes:
  - .git
  - node_modules
  - src
  - scripts
  - bin
  - package.json
  - package-lock.json
  - tsconfig.json
toki_suli_container_name: toki-suli
toki_suli_image: nginx:alpine
toki_suli_network_name: autoconfig-services
toki_suli_published_ports: []

# NOTE: *_secret_dir variables across all services point to /etc/ansible/secrets
# on the MANAGED HOST (not in this repo). Passwords and passphrases are stored
# there at runtime — either placed manually before the first run, or generated
# on first run (Borg passphrase). They are never committed to the repo.
server_dinnizer_enabled: false
dinnizer_network_name: autoconfig-services
dinnizer_root_dir: /opt/dinnizer
dinnizer_repo_dir: "{{ dinnizer_root_dir }}/app"
dinnizer_db_data_dir: "{{ dinnizer_root_dir }}/postgres"
dinnizer_secret_dir: /etc/ansible/secrets
dinnizer_repo_url: https://github.com/lionel-arnaud/dinnizer.git
dinnizer_repo_version: main
dinnizer_image_name: dinnizer:autoconfig
dinnizer_container_name: dinnizer
dinnizer_db_container_name: dinnizer-db
dinnizer_db_image: postgres:11-alpine
dinnizer_db_name: dinnizer_production
dinnizer_db_user: dinnizer
dinnizer_db_password_file: "{{ dinnizer_secret_dir }}/dinnizer-db-password"
dinnizer_secret_key_base_file: "{{ dinnizer_secret_dir }}/dinnizer-secret-key-base"
dinnizer_public_url: https://app.dinnizer.com
dinnizer_port: 3000
dinnizer_wait_retries: 30
dinnizer_wait_delay: 5
dinnizer_cloudinary_url: ""

server_excalidraw_enabled: false
# Excalidraw is a static-client SPA served by an nginx-based image. The image's
# default is port 80 inside the container; Caddy fronts it on draw.dinnizer.com
# with basic auth.
excalidraw_container_name: excalidraw
excalidraw_image: excalidraw/excalidraw:latest
excalidraw_network_name: autoconfig-services

server_jellyfin_enabled: false
# Jellyfin is a fully free, open-source media server. It replaces what Plex
# was doing for us — but without the Plex Pass paywall and without the
# claim-token dance. It exposes its web UI on 8096 (HTTP) and 8920 (HTTPS)
# inside the container; we publish 8096 to the LAN so the family can hit
# it from devices at home, and the public HTTPS path (media.dinnizer.com
# via Caddy) fronts it from the outside.
jellyfin_container_name: jellyfin
jellyfin_image: lscr.io/linuxserver/jellyfin:latest
jellyfin_network_name: autoconfig-services
jellyfin_config_dir: /opt/jellyfin/config
jellyfin_cache_dir: /opt/jellyfin/cache
jellyfin_media_root: /mnt/SSD_1TO
jellyfin_secret_dir: /etc/ansible/secrets
jellyfin_admin_password_file: "{{ jellyfin_secret_dir }}/jellyfin-admin-password"
jellyfin_admin_username: lion
jellyfin_timezone: Europe/Paris
jellyfin_puid: "{{ (lookup('pipe', 'id -u ' ~ (dotfiles_user | default('lion'))) | trim | int) }}"
jellyfin_pgid: "{{ (lookup('pipe', 'id -g ' ~ (dotfiles_user | default('lion'))) | trim | int) }}"
# 8096 only. 8920 is the HTTPS port inside the container, but HTTPS is disabled
# in Jellyfin itself (EnableHttps=false): Caddy terminates TLS for the public
# name and LAN clients use 8096. Publishing 8920 exposed a port that answered
# nothing.
jellyfin_published_ports:
  - "192.168.1.100:8096:8096"
jellyfin_api_key_file: "{{ jellyfin_config_dir }}/data/jellyfin-api.key"

# Libraries to create on first run (or to add idempotently on every run).
# The role waits for the Jellyfin API to come up, then POSTs each library
# if it doesn't already exist. Each entry needs:
#   name:              display name in the Jellyfin UI
#   collection_type:   one of 'movies', 'tvshows', 'music', 'musicvideos',
#                      'homevideos', 'mixed', 'boxsets'
#   paths:             list of container-internal paths (the bind mount makes
#                      /mnt/SSD_1TO appear as /data inside the container, so
#                      pass /data/Movies, not the host path)
#   preferred_language (optional) ISO code for metadata lookups
jellyfin_libraries:
  - name: Movies
    collection_type: movies
    paths:
      - /data/Movies
    preferred_language: fr
  - name: TV Shows
    collection_type: tvshows
    paths:
      - /data/TV Shows
    preferred_language: fr
  - name: Music
    collection_type: music
    paths:
      - /data/Music
    preferred_language: fr
  - name: Photos
    collection_type: homevideos
    paths:
      - /data/Pictures

# Uptime Kuma: external checks of the public sites, certs and DNS.
#
# Pinned to a MAJOR tag, not :latest, and that is the whole point. This role
# pulls with force_source and recreates the container whenever the image digest
# moves, so :latest would let a major release land unattended at 00:00. Uptime
# Kuma's v1 -> v2 upgrade rewrites its database in place and has no clean
# downgrade — recovery means restoring a backup. Nobody should meet that at
# midnight without having chosen it.
#
# ":2" still keeps it current: every v2 patch and minor arrives automatically on
# the nightly pull. Only a major bump is deliberate, and it is a one-line change
# here after taking a snapshot of uptime_kuma_data_dir.
server_uptime_kuma_enabled: false
uptime_kuma_image: louislam/uptime-kuma:2
uptime_kuma_container_name: uptime-kuma
uptime_kuma_network_name: autoconfig-services
uptime_kuma_data_dir: /opt/uptime-kuma
uptime_kuma_port: 3001

server_nextcloud_enabled: false
# Nextcloud keeps app state and its internal data on the server disk. Larger
# family storage can be exposed separately through nextcloud_external_mounts.
nextcloud_network_name: autoconfig-services
nextcloud_root_dir: /opt/nextcloud
nextcloud_app_dir: "{{ nextcloud_root_dir }}/app"
nextcloud_db_data_dir: "{{ nextcloud_root_dir }}/db"
nextcloud_data_dir: "{{ nextcloud_root_dir }}/data"
nextcloud_secret_dir: /etc/ansible/secrets
nextcloud_db_container_name: nextcloud-db
nextcloud_db_image: mariadb:11
nextcloud_container_name: nextcloud
# Pinned to the major version only, not :latest. An unpinned tag jumped a full
# major version (33 -> 34) on an ordinary nightly pull on 2026-09-13: the app
# container was recreated mid-run and one of its own bundled apps (theming)
# threw a PHP fatal error before the upgrade routine had reconciled it, failing
# the whole play. Pinning the major means patch/minor bumps still apply
# automatically, but a major jump (the kind that carries this class of
# app-compat break) now requires deliberately bumping this value.
nextcloud_image: nextcloud:34
nextcloud_db_name: nextcloud
nextcloud_db_user: nextclouduser
# The default Nextcloud table prefix. Named here because the external-mount
# check reads the file cache table directly.
nextcloud_db_table_prefix: oc_
nextcloud_db_password_file: "{{ nextcloud_secret_dir }}/nextcloud-db-password"
nextcloud_db_root_password_file: "{{ nextcloud_secret_dir }}/nextcloud-db-root-password"
nextcloud_admin_user: lion
nextcloud_admin_password_file: "{{ nextcloud_secret_dir }}/nextcloud-admin-password"
nextcloud_published_ports: []
nextcloud_public_url: https://cloud.dinnizer.com
nextcloud_trusted_domains:
  - cloud.dinnizer.com
nextcloud_trusted_proxies: []
nextcloud_forwarded_for_headers:
  - HTTP_X_FORWARDED_FOR
nextcloud_wait_retries: 30
nextcloud_wait_delay: 5
nextcloud_managed_users: []
nextcloud_external_mounts: []
nextcloud_external_mount_acl_user: www-data
nextcloud_external_mount_acl_excludes: []
nextcloud_acl_packages_by_family:
  Debian:
    - acl
  Archlinux:
    - acl

# Memory cache + transactional file locking. The official Nextcloud image ships
# the apcu and redis PHP extensions, so we use APCu for the local cache and a
# small Redis container for the distributed cache and file locking. This clears
# the "transactional file locking uses the database" and "no memory cache"
# setup warnings and genuinely speeds Nextcloud up. Off by default; hosts opt in.
nextcloud_redis_enabled: false
nextcloud_redis_image: redis:7-alpine
nextcloud_redis_container_name: nextcloud-redis
nextcloud_redis_data_dir: "{{ nextcloud_root_dir }}/redis"
nextcloud_redis_port: 6379

# Outgoing email. Nextcloud cannot self-generate SMTP credentials, so the
# password is read from a file you place on the host by hand (mode 0600), the
# same secrets directory as the DB/admin passwords but supplied rather than
# generated. SMTP config is skipped (with a notice) when the file is absent.
# mail_from_address + mail_domain build the From header, e.g.
# lionel + dinnizer.com -> lionel@dinnizer.com.
nextcloud_smtp_enabled: false
nextcloud_smtp_host: ""
nextcloud_smtp_port: 587
nextcloud_smtp_secure: tls            # tls = STARTTLS (587); ssl = implicit TLS (465)
nextcloud_smtp_auth: true
nextcloud_smtp_name: ""               # SMTP username (the authenticated account)
nextcloud_smtp_from_address: ""       # local part of the From address
nextcloud_smtp_from_domain: ""        # domain part of the From address
nextcloud_smtp_password_file: "{{ nextcloud_secret_dir }}/nextcloud-smtp-password"

# Small occ-driven setup-warning fixes. Empty values are skipped.
nextcloud_default_phone_region: ""           # ISO 3166-1 code, e.g. FR
nextcloud_maintenance_window_start: ""       # UTC hour 0-23 for heavy daily jobs
nextcloud_bruteforce_allowlist: []           # CIDRs exempt from brute-force throttle

# Background jobs. Calendar subscriptions and many maintenance jobs only refresh
# reliably when cron.php runs on a real schedule. Keep this host-level instead of
# adding another container: systemd can directly call the existing app container.
nextcloud_cron_enabled: true
nextcloud_cron_timer_name: autoconfig-nextcloud-cron
nextcloud_cron_on_calendar: "*:0/5"
nextcloud_calendar_subscription_refresh_rate: PT6H

server_frigate_enabled: false
# Frigate is started as a migration skeleton first because the service depends on
# host hardware details that differ between the raspi and serverannah.
frigate_root_dir: /mnt/verbatim/frigate
frigate_config_dir: "{{ frigate_root_dir }}/config"
frigate_media_dir: "{{ frigate_root_dir }}/media"
frigate_secret_dir: /etc/ansible/secrets
frigate_rtsp_password_file: "{{ frigate_secret_dir }}/frigate-rtsp-password"
frigate_admin_username: admin
frigate_admin_password_file: "{{ frigate_secret_dir }}/frigate-admin-password"
frigate_auth_state_hash_file: "{{ frigate_root_dir }}/.ansible-auth-hash"
frigate_container_name: frigate
frigate_image: ghcr.io/blakeblackshear/frigate:stable
frigate_network_name: autoconfig-services
frigate_shm_size: 256M
frigate_devices: []
frigate_published_ports:
  - "8971:8971"
  - "8554:8554"
  - "8555:8555/tcp"
  - "8555:8555/udp"
frigate_camera_name: usb_cam
frigate_camera_path: /dev/video0
frigate_detect_width: 640
frigate_detect_height: 480
frigate_detect_fps: 10
frigate_motion_threshold: 50
frigate_motion_contour_area: 150
frigate_motion_improve_contrast: true
frigate_zone_name: dining_room
frigate_zone_coordinates: 0.31,0.237,0.309,0.831,0.663,0.821,0.615,0.19
frigate_record_retain_days: 1
# Split out by Frigate 0.17; both inherit the old single retention by default.
frigate_record_continuous_days: "{{ frigate_record_retain_days }}"
frigate_record_motion_days: "{{ frigate_record_retain_days }}"
# Schema version Frigate stamps into config.yml. Bump alongside frigate_image.
frigate_alerts_retain_days: 2
frigate_detections_retain_days: 2
frigate_snapshots_retain_days: 1

# Keep storage simple: the repo ships the target host's /etc/fstab, and the
# server role copies it into place instead of rebuilding mount lines from vars.
server_manage_fstab: false
server_fstab_src: ""

server_fail2ban_enabled: false
# Start with SSH protection before layering on app-specific jails. This is the
# highest-value protection step before exposing the host further to the internet.
fail2ban_packages_by_family:
  Debian:
    - fail2ban
  Archlinux:
    - fail2ban
fail2ban_ignoreips:
  - 127.0.0.1/8
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_sshd_enabled: true
fail2ban_sshd_port: ssh
fail2ban_sshd_backend: systemd
fail2ban_caddy_basic_auth_enabled: false
fail2ban_caddy_basic_auth_logpath: /opt/reverse-proxy/data/access.log
fail2ban_caddy_basic_auth_maxretry: 5
fail2ban_caddy_basic_auth_findtime: 10m
fail2ban_caddy_basic_auth_bantime: 1h

# Hard cap on one Borg run so a hung dump or a stalled repo lock becomes a
# failure (which notifies) instead of an eternally "activating" unit.
backup_timeout: 4h

# Off-site copy of the Borg repository. Disabled by default; the repo is
# repokey-encrypted, so the cloud provider only ever sees opaque segments and no
# extra encryption layer is needed.
backup_offsite_enabled: false
backup_offsite_remote: "Google Drive Perso"
backup_offsite_path: backups/borg/serverannah
# The backup runs as root; the OAuth token belongs to the desktop user. Point at
# that user's config explicitly rather than relying on root's (empty) one.
backup_offsite_rclone_config: "/home/{{ desktop_user | default('lion') }}/.config/rclone/rclone.conf"
backup_offsite_transfers: 4
# Set e.g. "8M" to keep a large first upload from saturating the home uplink.
# The first run transfers the whole repo; later runs are incremental.
backup_offsite_bwlimit: ""

server_backup_enabled: false
backup_packages_by_family:
  Debian:
    - borgbackup
  Archlinux:
    - borg
backup_root_dir: /var/lib/autoconfig-backup
backup_dump_dir: "{{ backup_root_dir }}/dumps"
backup_required_mount: /mnt/back-up
backup_repo_dir: /mnt/back-up/borg/serverannah
backup_secret_dir: /etc/ansible/secrets
backup_borg_passphrase_file: "{{ backup_secret_dir }}/borg-passphrase"
backup_timer_name: autoconfig-borg-backup
backup_timer_on_calendar: daily
backup_retention_keep_daily: 7
backup_retention_keep_weekly: 4
backup_retention_keep_monthly: 6
# Backups pushed here by other hosts (see tasks/backup_inbox.yml).
backup_inbox_enabled: false
backup_inbox_user: backup-inbox
backup_inbox_dir: /var/lib/backup-inbox
backup_inbox_rrsync: /usr/bin/rrsync
backup_inbox_clients:
  - name: raspi
    public_key: files/backup/raspi-trading-agent.pub

# The trading agent's daily page: rendered on the Pi, pushed into the backup
# inbox, served from here. See tasks/trader_dashboard.yml.
server_trader_dashboard_enabled: false
trader_dashboard_container_name: trader-dashboard
trader_dashboard_image: "{{ server_reverse_proxy_image }}"
trader_dashboard_network_name: autoconfig-services
trader_dashboard_site_dir: "{{ backup_inbox_dir }}/raspi/dashboard"

backup_paths:
  - /opt/aumenuilya
  - /opt/nextcloud
  - /opt/pihole
  - /opt/homepage/config
  - /opt/reverse-proxy
  # State pushed from other hosts. Nothing else backs the Pi up.
  - /var/lib/backup-inbox
# Live database files are skipped: a running MariaDB rewrites them while Borg
# reads, so a raw copy is never consistent, and Borg exits with a warning
# ("file changed while we backed it up"). Each one is already captured
# consistently by its dump in backup_database_dumps below.
backup_exclude_paths:
  - "{{ nextcloud_db_data_dir }}"
  - "{{ aumenuilya_db_data_dir }}"
backup_database_dumps:
  - name: aumenuilya
    container: "{{ aumenuilya_db_container_name }}"
    database: "{{ aumenuilya_db_name }}"
    user: root
    password_file: "{{ aumenuilya_db_root_password_file }}"
  - name: nextcloud
    container: "{{ nextcloud_db_container_name }}"
    database: "{{ nextcloud_db_name }}"
    user: root
    password_file: "{{ nextcloud_db_root_password_file }}"

server_pihole_enabled: false
# Keep the production cutover explicit. Switching the host to production mode is
# a deliberate code change, separate from the router/DHCP cutover outside Ansible.
pihole_mode: production
pihole_mode_profiles:
  production:
    dns_listening_mode: LOCAL
    published_ports:
      - "53:53/tcp"
      - "53:53/udp"
  staged:
    dns_listening_mode: ALL
    published_ports:
      - "5300:53/tcp"
      - "5300:53/udp"
pihole_extra_published_ports: []
# Pi-hole stays on the same shared Docker network so the reverse proxy can front
# the admin UI without exposing another host HTTP port.
pihole_container_name: pihole
# Track the upstream Pi-hole container. The role recreates the container only
# when Docker actually pulls a newer image digest.
pihole_image: pihole/pihole:latest
pihole_network_name: autoconfig-services
pihole_root_dir: /opt/pihole
pihole_config_dir: "{{ pihole_root_dir }}/etc-pihole"
pihole_secret_dir: /etc/ansible/secrets
pihole_web_password_file: "{{ pihole_secret_dir }}/pihole-web-password"
pihole_timezone: Europe/Paris
pihole_dns_listening_mode: "{{ pihole_mode_profiles[pihole_mode].dns_listening_mode }}"
# Custom local DNS records — Pi-hole v6 stores these in the
# `[dns] hosts = [...]` array of /etc/pihole/pihole.toml. Each item becomes a
# hard A record served to every LAN client pointing at Pi-hole. Use for
# short names that should resolve to a fixed homelab address (the opencode
# server, the NAS, the reverse proxy itself) — DHCP-registered names from
# the dnsmasq DHCP side coexist with these; if both register the same
# name, this list wins.
#
# Schema: list of dicts with `name` (FQDN or short hostname) and `ip`. Both
# required. No support for CNAME / multiple A records per name on purpose —
# keep the schema flat so a typo in one entry is obvious in diff.
pihole_custom_dns_records: []
pihole_dns_upstreams:
  - 8.8.8.8
  - 8.8.4.4
  - 2001:4860:4860::8888
  - 2001:4860:4860::8844
pihole_dns_domain: lan
pihole_dns_ptr_mode: PI.HOLE
pihole_dns_domain_needed: true
pihole_dns_expand_hosts: true
pihole_dns_bogus_priv: true
pihole_dns_query_logging: true
pihole_dns_edns0_ecs: true
# The raspi audit showed that the meaningful policy state lives in gravity.db.
# Importing adlists and exact allowlist domains from extracted text files is a
# safer source-of-truth than copying the whole live database blindly.
pihole_policy_import_enabled: false
pihole_policy_root: "{{ playbook_dir }}/files/pihole/policy"
pihole_adlists_file: "{{ pihole_policy_root }}/adlists_enabled.txt"
pihole_allowlist_exact_file: "{{ pihole_policy_root }}/allowlist_exact.txt"
pihole_import_comment: Managed by ansible Pi-hole import
pihole_policy_hash_file: "{{ pihole_root_dir }}/.ansible-policy-hash"
pihole_published_ports: "{{ pihole_mode_profiles[pihole_mode].published_ports + pihole_extra_published_ports }}"
# NET_ADMIN is kept explicit because Pi-hole documents it as the practical
# default for containerized network operations, even when DHCP stays off.
pihole_capabilities:
  - NET_ADMIN

server_reverse_proxy_enabled: false
# Caddy keeps the reverse proxy readable enough to use as a learning tool.
server_reverse_proxy_container_name: server-reverse-proxy
server_reverse_proxy_image: caddy:2.10-alpine
# HTTP/3 needs UDP 443 published and forwarded; neither is set up, so it stays
# off rather than being advertised to browsers that then hang on it.
server_reverse_proxy_http3_enabled: false
server_reverse_proxy_root_dir: /opt/reverse-proxy
server_reverse_proxy_config_dir: "{{ server_reverse_proxy_root_dir }}/caddy"
server_reverse_proxy_data_dir: "{{ server_reverse_proxy_root_dir }}/data"
server_reverse_proxy_secret_dir: /etc/ansible/secrets
server_reverse_proxy_access_log: /data/access.log
server_reverse_proxy_network_name: autoconfig-services
server_reverse_proxy_auto_https: false
server_reverse_proxy_published_ports:
  - "80:80"
server_reverse_proxy_basic_auth_default_user: lion
# Each site can either proxy to an upstream or redirect to a canonical host.
server_reverse_proxy_sites: []
# HSTS tells browsers to only ever reach these hosts over HTTPS. Only safe once a
# host reliably serves HTTPS, so it is off by default and only emitted when
# auto_https is on. The value is max-age in seconds; we ship a one-year window
# which exceeds the 180-day minimum Nextcloud recommends. includeSubDomains and
# preload are deliberately omitted to avoid committing every *.dinnizer.com
# subdomain to HTTPS-only.
server_reverse_proxy_hsts_enabled: false
server_reverse_proxy_hsts_max_age: 31536000

server_aumenuilya_enabled: false
aumenuilya_network_name: autoconfig-services
aumenuilya_root_dir: /opt/aumenuilya
aumenuilya_app_dir: "{{ aumenuilya_root_dir }}/wordpress"
aumenuilya_db_data_dir: "{{ aumenuilya_root_dir }}/mariadb"
aumenuilya_import_dir: "{{ aumenuilya_root_dir }}/import"
aumenuilya_secret_dir: /etc/ansible/secrets
aumenuilya_db_container_name: aumenuilya-db
aumenuilya_app_container_name: aumenuilya
aumenuilya_db_image: mariadb:11.4
# The live Pi site has been updated beyond the old 2022 backup. Track the modern
# PHP line explicitly instead of pinning the restored container to old WP/PHP.
aumenuilya_wordpress_image: wordpress:php8.2-apache
aumenuilya_wpcli_image: wordpress:cli-php8.2
aumenuilya_db_name: aumenuilkomyriam
aumenuilya_db_user: aumenuilkomyriam
aumenuilya_db_password_file: "{{ aumenuilya_secret_dir }}/aumenuilya-db-password"
aumenuilya_db_root_password_file: "{{ aumenuilya_secret_dir }}/aumenuilya-db-root-password"
aumenuilya_table_prefix: wp_
aumenuilya_old_url: http://www.aumenuilya.fr
aumenuilya_public_url: http://aumenuilya.localtest.me:8081
aumenuilya_backup_root: ""
aumenuilya_source_tree: "{{ aumenuilya_backup_root }}/www_old"
aumenuilya_source_wp_content: "{{ aumenuilya_source_tree }}/wp-content/"
aumenuilya_source_htaccess: "{{ aumenuilya_source_tree }}/.htaccess"
aumenuilya_source_ads_txt: "{{ aumenuilya_backup_root }}/ads.txt"
aumenuilya_source_sql_dump: "{{ aumenuilya_backup_root }}/aumenuilkomyriam_mysql_db_NoComments_20220515.sql"
aumenuilya_published_ports: []
aumenuilya_wait_retries: 30
aumenuilya_wait_delay: 5

server_timeshift_enabled: false
timeshift_device_uuid: ""
timeshift_mount_point: /mnt/SSD_512
timeshift_schedule:
  - weekly
  - daily
timeshift_keep_monthly: "2"
timeshift_keep_weekly: "3"
timeshift_keep_daily: "5"
# Marker proving the one-off "initial" snapshot already happened. Deliberately
# not derived from timeshift.json: Timeshift rewrites that file constantly.
timeshift_initial_snapshot_marker: /etc/timeshift/.ansible-initial-snapshot-taken

# Only the keys the role actually owns. Everything else in timeshift.json —
# snapshot_size, snapshot_count, date_format, exclude, exclude-apps — belongs to
# Timeshift itself or to the operator, and is left untouched on every run.
timeshift_managed_config:
  backup_device_uuid: "{{ timeshift_device_uuid }}"
  parent_device_uuid: ""
  do_first_run: "false"
  btrfs_mode: "false"
  include_btrfs_home_for_backup: "false"
  include_btrfs_home_for_restore: "false"
  schedule_monthly: "{{ 'true' if 'monthly' in timeshift_schedule else 'false' }}"
  schedule_weekly: "{{ 'true' if 'weekly' in timeshift_schedule else 'false' }}"
  schedule_daily: "{{ 'true' if 'daily' in timeshift_schedule else 'false' }}"
  schedule_hourly: "false"
  schedule_boot: "false"
  count_monthly: "{{ timeshift_keep_monthly }}"
  count_weekly: "{{ timeshift_keep_weekly }}"
  count_daily: "{{ timeshift_keep_daily }}"
  count_hourly: "0"
  count_boot: "0"

# opencode: AI coding agent with a built-in web UI (opencode web). Hosted natively
# on serverannah so its sessions live on the same disk as the homelab services
# and benefit from the existing Borg backup set (see backup_paths).
#
# Bound to the LAN address (not 0.0.0.0) so the port is unreachable from outside
# the home network even if the router accidentally forwards it — the public
# hostname only exists behind Caddy on 443. The systemd user unit exports
# OPENCODE_SERVER_PASSWORD (basic auth) so a stray LAN device cannot just open
# the dashboard without the shared Caddy password.
server_opencode_enabled: false
# The upstream install script (https://opencode.ai/install) ignores
# OPENCODE_INSTALL_DIR on most recent versions and defaults to
# `~/.opencode/bin/opencode`. Tracking the real install location keeps the
# systemd unit's ExecStart in sync with where the binary actually lands.
server_opencode_install_script_url: https://opencode.ai/install
server_opencode_user_home: "/home/{{ server_opencode_user }}"
server_opencode_binary: "{{ server_opencode_user_home }}/.opencode/bin/opencode"
server_opencode_port: 4096
# Bind on the LAN IP only. Caddy reaches it via 192.168.1.100:4096 from inside
# the container network — same pattern as Jellyfin (see Caddyfile.j2 sites).
server_opencode_lan_ip: 192.168.1.100
server_opencode_user: "{{ dotfiles_user | default(desktop_user | default('lion')) }}"
server_opencode_server_username: lion
server_opencode_secret_dir: /etc/ansible/secrets
server_opencode_password_file: "{{ server_opencode_secret_dir }}/opencode-server-password"

# rclone Google Drive mount: the same remote that lives on savannarchome
# (Google Drive Perso) is mounted under the desktop user's home, so opencode's
# @-file search picks up the cloud files. The systemd user unit guards against
# the user accidentally logging out (the mount would die with the shell that
# started it).
#
# `server_rclone_gdrive_enabled: true` only deploys the service; the mount
# itself waits until the user has run `rclone config` once to authorise the
# remote. Until then, the service starts and rclone exits cleanly with a clear
# message, so it never bricks the host.
server_rclone_gdrive_enabled: false
server_rclone_gdrive_remote: "Google Drive Perso"
server_rclone_gdrive_mount_point: "{{ server_opencode_user_home }}/Google Drive Perso"
server_rclone_gdrive_user: "{{ server_opencode_user }}"
server_rclone_gdrive_user_home: "/home/{{ server_rclone_gdrive_user }}"
server_rclone_gdrive_options:
  - --drive-skip-shortcuts
  - --vfs-cache-mode
  - full
  - --vfs-cache-max-age
  - 72h
