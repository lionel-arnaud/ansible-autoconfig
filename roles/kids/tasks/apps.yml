---
# Learning + gaming software. Three delivery channels, matching how the machine
# was actually set up: plain apt packages, Steam (needs 32-bit), and Flatpak.

- name: Install learning applications (apt)
  ansible.builtin.apt:
    name: "{{ kids_apt_learning }}"
    state: present

- name: Install native games (apt)
  ansible.builtin.apt:
    name: "{{ kids_apt_games }}"
    state: present

- name: Install gamemode (game performance helper)
  ansible.builtin.apt:
    name: "{{ kids_gamemode_packages }}"
    state: present
  when: kids_gamemode_enabled | default(true)

- name: Disable Mission Espace automatic launch for child accounts
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.config/autostart/mission-espace.desktop"
    state: absent
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"

# Steam's native package ships only as 32-bit, so i386 must be enabled before apt
# can resolve it. Ubuntu uses the Flatpak delivery path instead (see defaults).
- name: Check whether the i386 architecture is enabled for Steam
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: kids_dpkg_foreign_architectures
  changed_when: false
  when:
    - kids_steam_enabled | default(true)
    - kids_steam_install_method == 'apt'

- name: Enable the i386 architecture for Steam
  ansible.builtin.command: dpkg --add-architecture i386
  when:
    - kids_steam_enabled | default(true)
    - kids_steam_install_method == 'apt'
    - "'i386' not in kids_dpkg_foreign_architectures.stdout_lines"

- name: Refresh apt cache after adding i386
  ansible.builtin.apt:
    update_cache: true
  when:
    - kids_steam_enabled | default(true)
    - kids_steam_install_method == 'apt'

- name: Install Steam
  ansible.builtin.apt:
    name: "{{ kids_steam_packages }}"
    state: present
  when:
    - kids_steam_enabled | default(true)
    - kids_steam_install_method == 'apt'

- name: Ensure Guacamelee 2 Proton prefix parents remain available
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.steam/debian-installation/steamapps/compatdata/534550"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0755'
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: kids_steam_enabled | default(true)

- name: Configure Guacamelee 2's per-user WineD3D Proton fallback
  ansible.builtin.script:
    cmd: >-
      guacamelee2-compat.py
      /home/{{ item.name }}/.steam/debian-installation/config/config.vdf
      {{ kids_guacamelee2_steam_appid }}
      {{ kids_guacamelee2_compat_tool }}
      {{ kids_guacamelee2_compat_config }}
    executable: python3
  register: kids_guacamelee2_compat_result
  changed_when: "kids_guacamelee2_compat_result.stdout | trim == 'changed'"
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - kids_steam_enabled | default(true)
    - kids_guacamelee2_wined3d_enabled | default(false)

- name: Configure Guacamelee 2's Steam launch options for initialized accounts
  ansible.builtin.script:
    cmd: >-
      guacamelee2-launch-options.py
      /home/{{ item.name }}/.steam/debian-installation
      {{ kids_guacamelee2_steam_appid }}
      {{ ('STEAM_COMPAT_LIBRARY_PATHS=/home/' ~ item.name ~ '/.steam/debian-installation/steamapps ' ~ kids_guacamelee2_launch_options) | quote }}
    executable: python3
  register: kids_guacamelee2_launch_options_result
  changed_when: "kids_guacamelee2_launch_options_result.stdout | trim == 'changed'"
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - kids_steam_enabled | default(true)
    - kids_guacamelee2_wined3d_enabled | default(false)

# Flatpak apps from Flathub. flatpak itself is already part of the Mint base.
- name: Ensure the Flathub remote is configured
  community.general.flatpak_remote:
    name: "{{ kids_flatpak_remote_name }}"
    flatpakrepo_url: "{{ kids_flatpak_remote_url }}"
    state: present
  when: kids_flatpak_enabled | default(true)

- name: Install Flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    remote: "{{ kids_flatpak_remote_name }}"
    state: present
  loop: >-
    {{ kids_flatpak_apps +
       ([kids_steam_flatpak_app] if kids_steam_enabled | default(true)
       and kids_steam_install_method == 'flatpak' else []) }}
  when: kids_flatpak_enabled | default(true)

# The Flatpak module's `present` state installs missing applications but does not
# refresh applications or their runtimes.  Check first so scheduled pulls avoid
# launching a no-op update process, then update every system-installed Flatpak
# app/runtime non-interactively when Flathub publishes an update.
- name: Check for available system Flatpak updates
  ansible.builtin.command:
    argv:
      - flatpak
      - --system
      - remote-ls
      - --updates
      - --columns=ref
  register: kids_flatpak_updates_available
  changed_when: false
  when: kids_flatpak_enabled | default(true)

- name: Update available system Flatpak applications and runtimes
  ansible.builtin.command:
    argv:
      - flatpak
      - update
      - --system
      - --noninteractive
      - --assumeyes
  when:
    - kids_flatpak_enabled | default(true)
    - kids_flatpak_updates_available.stdout | trim | length > 0
