---
- name: Install parent remote desktop packages
  ansible.builtin.apt:
    name: "{{ kids_parent_remote_desktop_packages }}"
    state: present
  when: kids_parent_remote_desktop_enabled | bool

- name: Configure the parent remote desktop to listen only on loopback
  ansible.builtin.ini_file:
    path: /etc/xrdp/xrdp.ini
    section: Globals
    option: port
    value: "tcp://{{ kids_parent_remote_desktop_bind_address }}:{{ kids_parent_remote_desktop_port }}"
    mode: "0644"
  register: kids_xrdp_config
  when: kids_parent_remote_desktop_enabled | bool

- name: Enable the parent remote desktop service
  ansible.builtin.systemd_service:
    name: xrdp
    state: "{{ kids_xrdp_config.changed | ternary('restarted', 'started') }}"
    enabled: true
  when: kids_parent_remote_desktop_enabled | bool

- name: Configure the system French keyboard layout
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: "0644"

- name: Create child desktop configuration directories
  ansible.builtin.file:
    path: "/home/{{ item.0.name }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0755"
  loop: "{{ kids_managed_users | product(kids_keyboard_directories) | list }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Install French AZERTY session helper for child accounts
  ansible.builtin.template:
    src: force-french-keyboard.sh.j2
    dest: "/home/{{ item.name }}/{{ kids_keyboard_helper_path }}"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0755"
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start French AZERTY session helper for child accounts
  ansible.builtin.template:
    src: force-french-keyboard.desktop.j2
    dest: "/home/{{ item.name }}/.config/autostart/force-french-keyboard.desktop"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
  loop: "{{ kids_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
