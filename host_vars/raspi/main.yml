---
# Raspberry Pi 4 (Debian 13 trixie, aarch64). Used as a CLI/TUI dev + AI test
# bench, so it gets the common base, a curated dotfiles subset, and the
# workstation CLI tooling — but no GUI/Omarchy desktop config.
ansible_python_interpreter: /usr/bin/python3

# Failure notifications. Its own topic, separate from serverannah's, so one
# leaked topic does not expose both machines.
notify_enabled: true

# The vault password lives at ~/secret.txt here, not the role's default
# ~/.ansible-vault-pass. Without this the nightly pull cannot decrypt
# host_vars/raspi/vault.yml and the whole run aborts before it starts.
autoconfig_vault_password_file: /home/lion/secret.txt
notify_topic: qOa8RdyjqfhBpT1B

# Common foundation + dotfiles.
base_dotfiles_enabled: true
base_lazydocker_enabled: false

# CLI/TUI workstation tooling.
workstation_enabled: true
workstation_cli_enabled: true
workstation_dotfiles_enabled: true
workstation_espanso_enabled: false
# Headless: no desktop, so none of the desktop ufw application profiles exist
# here. ufw errors on an unknown profile rather than skipping it, which failed
# the first bootstrap on KDEConnect.
workstation_ufw_app_profiles: []
# LocalSend is a desktop file-transfer tool; nothing on this host serves it.
workstation_ufw_port_rules:
  - port: "22"
    proto: tcp

# The subset of dotfiles to apply here. Add more later as needed.
dotfiles_stow_packages:
  - bash
  - starship
  - nvim
  - git
  - gh
  - lazygit

# Trading agent. Paper endpoint only: trading_agent_mode and
# trading_agent_live_confirmed both default to their paper values in the role,
# and reaching live takes changing both here deliberately.
trading_agent_enabled: true
# opencode over the LAN. serverannah binds 4096 to 192.168.1.100 only, so this
# never leaves the house and needs no second password through Caddy.
trading_agent_opencode_url: http://192.168.1.100:4096
trading_agent_opencode_user: lion
